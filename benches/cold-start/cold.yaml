# Standalone one-row cold-start pipeline (instruments track, relocated from the
# retired `cold-start` benchmark cell — archive commit 40841ab). The
# check-cold-start.sh harness fills @FILES@ and @WORK@ per run and asserts the
# release binary starts this pipeline in <= 40 ms median. file -> duckdb keeps
# the original protocol (the recorded 24.2 ms floor was measured this way).
pipeline: cold-start
workdir: @WORK@/.rdlt-cold
source:
  file: {config: @FILES@}
destination:
  duckdb: {path: @WORK@/cold.duckdb}
