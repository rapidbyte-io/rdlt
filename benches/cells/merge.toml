# Merge-path scoreboards (features 008/010) — no gates.
#
# The strategy cells run the shipped CLI end to end. The index/refinement
# cells are SQL-LEVEL: they measure the exact statement shapes the strategies
# emit via EXPLAIN ANALYZE inside BEGIN/ROLLBACK (timing = "stdout_ms" — the
# server-side Execution Time, the statistic the 008/010 scoreboards recorded;
# wall clock would add client overhead that is not the claim).

# -- strategy comparison (1M-row pg→pg, load 2 re-delivers all, 50% changed) --

[[cell]]
id = "strategy-delete-insert-1m"
class = "scoreboard"
mode = "subprocess"
fixture = "strat-pg"
pipeline = "cells/pipelines/strat-delete-insert.yaml"
prepare_sh = "sh {{benches}}/fixtures/merge_prepare.sh rdlt-bench-strat-pg {{cli}} {{spec}} {{run}} strat_delete_insert"
warmups = 0
runs = 5
verify = { table = "pg_wide", expected_rows = 1000000 }
[cell.workload]
rows = 1000000
regime = "full redelivery, 50% changed — load-2 wall time"

[[cell]]
id = "strategy-upsert-1m"
class = "scoreboard"
mode = "subprocess"
fixture = "strat-pg"
pipeline = "cells/pipelines/strat-upsert.yaml"
prepare_sh = "sh {{benches}}/fixtures/merge_prepare.sh rdlt-bench-strat-pg {{cli}} {{spec}} {{run}} strat_upsert"
warmups = 0
runs = 5
verify = { table = "pg_wide", expected_rows = 1000000 }
[cell.workload]
rows = 1000000
regime = "full redelivery, 50% changed — load-2 wall time"
note = "upsert's value is SEMANTIC (no delete-visibility window, hard-delete composition), not throughput"

# -- merge-identity index (feature 008 M5): the delete-insert DELETE shape ----

[[cell]]
id = "merge-index-incremental-unindexed"
class = "scoreboard"
mode = "subprocess"
fixture = "merge-index-pg"
command = ["sh", "{{benches}}/fixtures/sql_timed.sh", "rdlt-bench-merge-index-pg", "{{benches}}/fixtures/sql/mi_delete_small.sql"]
prepare_sh = "$(command -v podman || command -v docker) exec rdlt-bench-merge-index-pg psql -qX -U postgres -c 'DROP INDEX IF EXISTS rdlt_ix_bench; ANALYZE target;' >/dev/null"
timing = "stdout_ms"
warmups = 1
runs = 5
[cell.workload]
regime = "5k-key incremental delta vs 10M rows, no index"

[[cell]]
id = "merge-index-incremental-indexed"
class = "scoreboard"
mode = "subprocess"
fixture = "merge-index-pg"
command = ["sh", "{{benches}}/fixtures/sql_timed.sh", "rdlt-bench-merge-index-pg", "{{benches}}/fixtures/sql/mi_delete_small.sql"]
prepare_sh = "$(command -v podman || command -v docker) exec rdlt-bench-merge-index-pg psql -qX -U postgres -c 'CREATE INDEX IF NOT EXISTS rdlt_ix_bench ON target (id); ANALYZE target;' >/dev/null"
timing = "stdout_ms"
warmups = 1
runs = 5
[cell.workload]
regime = "5k-key incremental delta vs 10M rows, rdlt_ix_* present — the common production merge"

