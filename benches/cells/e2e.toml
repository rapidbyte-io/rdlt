# The five-cell e2e matrix (feature 018, data-model §1). One flat file — the
# retired importance/taxonomy vocabulary is gone (the loader rejects it). Each
# cell is a three-way-comparable end-to-end pipeline: source data → product →
# destination, same seeded data
# and same destination server/store for every arm. `note` is the cell's claim,
# rendered as the matrix caption; `verify` pins destination row count = expected
# on every arm (FR-015). Competitors run their fastest honest configuration
# (dlt: connectorx for pg extraction — variant `dlt`; pyarrow retained as
# recorded context on pg-source cells — variant `dlt-pyarrow`). All competitor
# arms reach the host fixtures over `network = "host"` at their fixed ports.

# ---------------------------------------------------------------------------
# pg-to-pg-1m — Postgres → Postgres, 1M rows, full replace.
# ---------------------------------------------------------------------------
[[cell]]
id = "pg-to-pg-1m"
fixtures = ["pg"]
pipeline = "cells/pipelines/pg-to-pg.yaml"
note = "Postgres → Postgres, 1M×12 rows, full replace — the everyday relational table copy."
[cell.verify]
events = 1_000_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_pg_pg.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "connectorx", "events"]
network = "host"
[[cell.competitor]]
variant = "dlt-pyarrow"
args = ["pipeline_pg_pg.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "pyarrow", "events"]
network = "host"
# Airbyte: driver.py drives the pre-created connection (setup.py). Args are the
# cell id (keys state.json) + expected rows. Full-refresh overwrite.
[[cell.competitor]]
variant = "airbyte"
args = ["pg-to-pg-1m", "1000000"]

# ---------------------------------------------------------------------------
# pg-to-s3parquet-1m — Postgres → Parquet on S3, 1M rows, full replace.
# ---------------------------------------------------------------------------
[[cell]]
id = "pg-to-s3parquet-1m"
fixtures = ["pg", "rustfs"]
pipeline = "cells/pipelines/pg-to-s3parquet.yaml"
note = "Postgres → Parquet on S3, 1M×12 rows, full replace — relational extract to a lake."
# Bytes each arm LEFT BEHIND, next to how long it took. Without this the cell
# compared a compressed artifact against an uncompressed one and reported it as
# parity. Untimed, run after the timed runs, and recorded as ABSENT (never
# zero) if it cannot reach the store.
artifact_bytes_sh = "python3 {{benches}}/fixtures/s3_prefix_bytes.py http://127.0.0.1:19110 lake rdlt/ rdlt-bench rdlt-bench-secret"
[cell.verify]
events = 1_000_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_pg_s3parquet.py", "{{conn}}", "connectorx", "events", "http://127.0.0.1:19110", "rdlt-bench", "rdlt-bench-secret", "lake", "dlt"]
network = "host"
artifact_bytes_sh = "python3 {{benches}}/fixtures/s3_prefix_bytes.py http://127.0.0.1:19110 lake dlt/ rdlt-bench rdlt-bench-secret"
[[cell.competitor]]
variant = "dlt-pyarrow"
# Its OWN prefix. Both dlt variants used to write to lake/dlt/, so the two arms
# shared one set of objects and whichever ran second determined what a
# per-prefix measurement would attribute to both. Timing was unaffected —
# each arm still ran its own pipeline — but bytes-written per arm could not
# mean anything until the arms stopped overwriting each other.
args = ["pipeline_pg_s3parquet.py", "{{conn}}", "pyarrow", "events", "http://127.0.0.1:19110", "rdlt-bench", "rdlt-bench-secret", "lake", "dlt-pyarrow"]
network = "host"
artifact_bytes_sh = "python3 {{benches}}/fixtures/s3_prefix_bytes.py http://127.0.0.1:19110 lake dlt-pyarrow/ rdlt-bench rdlt-bench-secret"
# Airbyte: pg source -> S3 (parquet) destination at lake/airbyte/. Driver cleans
# the lake prefix per run (the fixture reset does not).
[[cell.competitor]]
variant = "airbyte"
args = ["pg-to-s3parquet-1m", "1000000"]
artifact_bytes_sh = "python3 {{benches}}/fixtures/s3_prefix_bytes.py http://127.0.0.1:19110 lake airbyte/ rdlt-bench rdlt-bench-secret"

# ---------------------------------------------------------------------------
# s3jsonl-to-pg-200k — nested JSONL on S3 → Postgres, 200k records, replace.
# ---------------------------------------------------------------------------
[[cell]]
id = "s3jsonl-to-pg-200k"
fixtures = ["rustfs", "pg"]
pipeline = "cells/pipelines/s3jsonl-to-pg.yaml"
note = "Nested JSONL on S3 → Postgres, 200k records, full replace — semi-structured ingestion with child-table shredding."
# The shred lands a child table too; declaring both is what makes the arm
# comparable with a competitor that moves only what it claims.
[cell.verify]
events = 200_000
events__tags = 400_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_s3jsonl_pg.py", "http://127.0.0.1:19110", "rdlt-bench", "rdlt-bench-secret", "raw", "landed/*.jsonl", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt"]
network = "host"
# Airbyte: S3 (jsonl) source -> pg destination dest_airbyte.public.events.
[[cell.competitor]]
variant = "airbyte"
args = ["s3jsonl-to-pg-200k", "200000"]

# ---------------------------------------------------------------------------
# s3jsonl-to-s3parquet-200k — nested JSONL on S3 → Parquet on S3, 200k records.
# ---------------------------------------------------------------------------
[[cell]]
id = "s3jsonl-to-s3parquet-200k"
fixtures = ["rustfs"]
pipeline = "cells/pipelines/s3jsonl-to-s3parquet.yaml"
note = "Nested JSONL on S3 → Parquet on S3, 200k records, full replace — lake file-format conversion."
[cell.verify]
events = 200_000
events__tags = 400_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_s3jsonl_s3parquet.py", "http://127.0.0.1:19110", "rdlt-bench", "rdlt-bench-secret", "raw", "landed/*.jsonl", "lake", "dlt"]
network = "host"
# Airbyte: S3 (jsonl) source -> S3 (parquet) destination at lake/airbyte/.
[[cell.competitor]]
