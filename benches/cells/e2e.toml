args = ["s3jsonl-to-s3parquet-200k", "200000"]

# ---------------------------------------------------------------------------
# pg-to-pg-dedup-1m — Postgres → Postgres, keep-in-sync by id (LOAD 2 measured).
# The rdlt arm's LOAD 1 (untimed) runs via prepare_sh against the load-1 spec;
# the measured pipeline re-delivers the 50%-changed rows and dedups by id. The
# dlt arm mirrors the two loads inside its script and times LOAD 2 only.
# ---------------------------------------------------------------------------
[[cell]]
id = "pg-to-pg-dedup-1m"
fixtures = ["pg"]
pipeline = "cells/pipelines/pg-to-pg-dedup.yaml"
prepare_sh = "cd {{workdir}} && {{cli}} run {{benches}}/cells/pipelines/pg-to-pg-dedup-load1.yaml"
note = "Postgres → Postgres, 1M rows, keep-in-sync by id — LOAD 2 measured: full re-delivery with 50% of rows changed, deduped by id. All three products run the same full-redelivery-plus-dedup regime; Airbyte's cheaper incremental regime is deliberately not benched (no dlt counterpart, research D-08)."
[cell.verify]
events_merged = 1_000_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_pg_pg_dedup.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "connectorx", "events", "events_v2"]
network = "host"
[[cell.competitor]]
variant = "dlt-pyarrow"
args = ["pipeline_pg_pg_dedup.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "pyarrow", "events", "events_v2"]
network = "host"
# Airbyte: closest supported dedup shape — a single incremental+dedup stream on
# events_v2 (PK id), connection STATE wiped per run so every run re-reads all
# 1M rows and dedups by id -> 1M. Airbyte cannot merge two distinct source
# tables (events -> events_v2) into one dest table via one connection, so it
# does not model the load1/load2 split; same full-redelivery-plus-dedup regime
# and final rowcount. Deviation documented in the module README.
[[cell.competitor]]
variant = "airbyte"
args = ["pg-to-pg-dedup-1m", "1000000"]

# ===========================================================================
# THE WIRE TWINS (041) — five `connector:`-spec twins of the cells above,
# same seeded work per twin, with the rdlt arm's connectors SPAWNED as
# processes over the connector protocol instead of compiled in. What they
# measure is the wire's whole cost at e2e grain, for the freeze verdict.
# SCOREBOARD, no bars (a bar needs a recorded session first — constitution
# v1.1.0). The dlt arms are copied from each twin so a session records
# same-machine, same-session ratios; Airbyte is deliberately absent — its
# job wall clock is floor-dominated (~45-60 s regardless of dataset) and
# adds nothing to a wire-overhead verdict. The connector bins come from
# `{{bins}}` (<target>/debug — the Makefile's spawn-bins line builds them).
# ===========================================================================

# ---------------------------------------------------------------------------
# pg-to-pg-1m-remote — the wire twin of pg-to-pg-1m.
# ---------------------------------------------------------------------------
[[cell]]
id = "pg-to-pg-1m-remote"
fixtures = ["pg"]
pipeline = "cells/pipelines/pg-to-pg-remote.yaml"
note = "The wire twin of pg-to-pg-1m: same work, spawned connectors — Postgres → Postgres, 1M×12 rows, full replace over the connector protocol."
[cell.verify]
events = 1_000_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_pg_pg.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "connectorx", "events"]
network = "host"
[[cell.competitor]]
variant = "dlt-pyarrow"
args = ["pipeline_pg_pg.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "pyarrow", "events"]
network = "host"

