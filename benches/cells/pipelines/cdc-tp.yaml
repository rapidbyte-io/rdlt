pipeline: cdc-tp
workdir: {{workdir}}/.rdlt
write_mode: {merge: {key: [id]}}
source:
  postgres:
    conn: "{{conn}}"
    cdc:
      slot: cdc_tp
      publication: cdc_tp_pub
      create_if_missing: true
    tables:
      - name: pg_wide
destination:
  postgres:
    conn: "host=127.0.0.1 port=5442 user=postgres password=postgres dbname=postgres"
    dataset: cdc_tp
    merge_strategy: upsert
    tables:
      pg_wide: {hard_delete: _rdlt_deleted}
