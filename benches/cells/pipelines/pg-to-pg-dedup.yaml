# 018 e2e matrix cell pg-to-pg-dedup-1m — the MEASURED load (LOAD 2 only,
# research D-08). A query stream named `events` reads the 50%-changed
# `events_v2` and merges by id into the SAME destination table `events` that
# LOAD 1 populated (LOAD 1 runs untimed via the cell's prepare_sh against
# pg-to-pg-dedup-load1.yaml). Full re-delivery + dedup by id.
pipeline: bench-pg-to-pg-dedup
workdir: {{workdir}}/.rdlt
write_mode:
  merge:
    key: [id]
source:
  postgres:
    conn: "{{conn}}"
    queries:
      - name: events
        sql: "SELECT * FROM events_v2"
        primary_key: [id]
destination:
  postgres:
    conn: "host=127.0.0.1 port=5439 user=postgres password=postgres dbname=dest_rdlt"
    dataset: bench
    merge_strategy: upsert
