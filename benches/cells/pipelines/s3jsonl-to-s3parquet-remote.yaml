# 041 e2e matrix cell s3jsonl-to-s3parquet-200k-remote — the wire twin of
# s3jsonl-to-s3parquet.yaml: the SAME work (nested jsonl on the RUSTFS `raw`
# bucket → parquet on the `lake` bucket under the `rdlt` prefix, full
# replace) with BOTH sides spawned as the file bin — two processes over one
# store. Source config is the fixture-generated files.yaml spelled inline
# (see s3jsonl-to-pg-remote.yaml); destination keys are the in-process
# twin's, verbatim.
pipeline: bench-s3jsonl-to-s3parquet-remote
workdir: {{workdir}}/.rdlt
write_mode: replace
source:
  connector:
    id: io.rapidbyte.file
    path: {{bins}}/rdlt-connector-file
    config:
      streams:
        - name: events
          format: jsonl
          path: "landed/*.jsonl"
          location:
            s3:
              endpoint: "http://127.0.0.1:19110"
              bucket: raw
              access_key: rdlt-bench
              secret_key: rdlt-bench-secret
destination:
  connector:
    id: io.rapidbyte.file
    path: {{bins}}/rdlt-connector-file
    config:
      path: rdlt
      format: parquet
      location:
        s3:
          endpoint: "http://127.0.0.1:19110"
          bucket: lake
          access_key: rdlt-bench
          secret_key: rdlt-bench-secret
