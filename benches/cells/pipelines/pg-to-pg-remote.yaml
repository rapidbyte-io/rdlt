# 041 e2e matrix cell pg-to-pg-1m-remote — the wire twin of pg-to-pg.yaml:
# the SAME work (src.events, 1M×12 → dest_rdlt, full replace) with both sides
# swapped to `connector:` refs, so the engine spawns the postgres bin twice
# and every batch crosses the connector protocol. Config keys are the
# in-process twin's, verbatim — the vocabularies are identical by design.
# `{{bins}}` is the harness's `<target>/debug`, where the Makefile's
# spawn-bins line puts the connector binaries.
pipeline: bench-pg-to-pg-remote
workdir: {{workdir}}/.rdlt
write_mode: replace
source:
  connector:
    id: io.rapidbyte.postgres
    path: {{bins}}/rdlt-connector-postgres
    config:
      conn: "{{conn}}"
      tables:
        - name: events
destination:
  connector:
    id: io.rapidbyte.postgres
    path: {{bins}}/rdlt-connector-postgres
    config:
      conn: "host=127.0.0.1 port=5439 user=postgres password=postgres dbname=dest_rdlt"
      dataset: bench
