# 041 e2e matrix cell pg-to-s3parquet-1m-remote — the wire twin of
# pg-to-s3parquet.yaml: the SAME work (src.events, 1M×12 → parquet on the
# RUSTFS `lake` bucket under the `rdlt` prefix, full replace) with the source
# spawned as the postgres bin and the destination as the file bin. Config
# keys are the in-process twin's, verbatim.
pipeline: bench-pg-to-s3parquet-remote
workdir: {{workdir}}/.rdlt
write_mode: replace
source:
  connector:
    id: io.rapidbyte.postgres
    path: {{bins}}/rdlt-connector-postgres
    config:
      conn: "{{conn}}"
      tables:
        - name: events
destination:
  connector:
    id: io.rapidbyte.file
    path: {{bins}}/rdlt-connector-file
    config:
      path: rdlt
      format: parquet
      location:
        s3:
          endpoint: "http://127.0.0.1:19110"
          bucket: lake
          access_key: rdlt-bench
          secret_key: rdlt-bench-secret
