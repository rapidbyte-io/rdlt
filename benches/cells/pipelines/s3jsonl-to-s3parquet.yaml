# 018 e2e matrix cell s3jsonl-to-s3parquet-200k: nested jsonl on the RUSTFS
# `raw` bucket → parquet files on the `lake` bucket under the per-product prefix
# `rdlt`, full replace. Single fixture rustfs: `{{data}}/files.yaml` is the
# generated file-source config; source and destination share the one store.
pipeline: bench-s3jsonl-to-s3parquet
workdir: {{workdir}}/.rdlt
write_mode: replace
source:
  file:
    config: {{data}}/files.yaml
destination:
  file:
    path: rdlt
    format: parquet
    location:
      s3:
        endpoint: "http://127.0.0.1:19110"
        bucket: lake
        access_key: rdlt-bench
        secret_key: rdlt-bench-secret
