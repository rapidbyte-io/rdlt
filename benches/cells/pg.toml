# Postgres-source cells (feature 005 datasets; identity = seed_pg.sql hashes,
# recorded at fixture seed). The gated baseline is dlt's FASTEST documented
# pure-dlt configuration (pyarrow backend), never its slow default; sqlalchemy
# and connectorx are recorded context (fewer runs, declared per-competitor —
# the run counts ride the artifact honestly).

[[cell]]
id = "pg-wide-duckdb-1m"
class = "gated"
mode = "subprocess"
fixture = "pg-src"
pipeline = "cells/pipelines/pg-wide-duckdb.yaml"
warmups = 1
runs = 5
verify = { table = "pg_wide", expected_rows = 1000000 }
[cell.workload]
rows = 1000000
columns = 12
note = "COPY-binary decode -> Arrow -> DuckDB"
[[cell.competitor]]
variant = "dlt-pyarrow"
args = ["pipeline_pg_duckdb.py", "{{conn}}", "pyarrow", "pg_wide"]
network = "host"
[[cell.competitor]]
variant = "dlt-sqlalchemy"
args = ["pipeline_pg_duckdb.py", "{{conn}}", "sqlalchemy", "pg_wide"]
network = "host"
runs = 2
[[cell.competitor]]
variant = "dlt-connectorx"
args = ["pipeline_pg_duckdb.py", "{{conn}}", "connectorx", "pg_wide"]
network = "host"
runs = 3

[[cell]]
id = "pg-wide-pg-1m"
class = "gated"
mode = "subprocess"
fixture = "pg-src"
pipeline = "cells/pipelines/pg-wide-pg.yaml"
warmups = 1
runs = 5
verify = { table = "pg_wide", expected_rows = 1000000 }
[cell.workload]
rows = 1000000
columns = 12
[[cell.competitor]]
variant = "dlt-pyarrow"
args = ["pipeline_pg_pg.py", "{{conn}}", "{{conn}}", "pyarrow", "pg_wide"]
network = "host"
[[cell.competitor]]
variant = "dlt-sqlalchemy"
args = ["pipeline_pg_pg.py", "{{conn}}", "{{conn}}", "sqlalchemy", "pg_wide"]
network = "host"
runs = 2

[[cell]]
id = "pg-jsonb-duckdb-200k"
class = "scoreboard"
mode = "subprocess"
fixture = "pg-src"
pipeline = "cells/pipelines/pg-jsonb-duckdb.yaml"
warmups = 1
runs = 5
verify = { table = "pg_jsonb", expected_rows = 200000 }
[cell.workload]
rows = 200000
note = "jsonb documents through the Json escape hatch, shredded downstream"
[[cell.competitor]]
variant = "dlt-pyarrow"
args = ["pipeline_pg_duckdb.py", "{{conn}}", "pyarrow", "pg_jsonb"]
network = "host"
