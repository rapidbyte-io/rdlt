# CDC scoreboard cells (feature 009 R11/SC-005) — no gates; the snapshot
# rides the unchanged gated COPY path. Both cells run the shipped CLI
# composition (merge + upsert + hard_delete), never a harness shortcut.

# Timed statistic: the catch-up run's wall time after prepare rebuilds a
# fresh slot + 1M snapshot and applies the ~500k-change backlog.
[[cell]]
id = "cdc-change-apply-500k"
class = "scoreboard"
mode = "subprocess"
fixture = "cdc-tp-pg"
pipeline = "cells/pipelines/cdc-tp.yaml"
prepare_sh = "sh {{benches}}/fixtures/cdc_prepare.sh rdlt-bench-cdc-tp-pg {{cli}} {{spec}} {{benches}} tp"
warmups = 0
runs = 5
[cell.workload]
snapshot_rows = 1000000
changes = "400k updates / 50k deletes / 50k inserts"
note = "each run: fresh slot+publication+dataset, reseed, untimed snapshot, backlog, TIMED catch-up"

# Quiet-to-caught-up latency on a 1k-update delta, warm slot. The 6 warmups
# are the recorded settle protocol: run 1 snapshots, runs 2-6 walk the ack
# design's one-run-behind backlog (the peek decodes from the CONFIRMED
# position) until steady state; each counted run gets a fresh 1k-update delta.
# Workdir is fresh per run (state rides destination + slot — ResumedFrom::
# Cursor), noted here because the recorded runs kept one workdir.
[[cell]]
id = "cdc-catchup-latency-1k"
class = "scoreboard"
mode = "subprocess"
fixture = "cdc-lat-pg"
pipeline = "cells/pipelines/cdc-lat.yaml"
prepare_sh = "$(command -v podman || command -v docker) exec rdlt-bench-cdc-lat-pg psql -qX -U postgres -c \"UPDATE pg_wide SET small = small + 1 WHERE id <= 1000\" >/dev/null"
warmups = 6
runs = 5
[cell.workload]
delta = "1k updates"
note = "steady-state latency; settle-before-timing preserved as warmups"
