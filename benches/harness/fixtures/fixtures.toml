# Fixture registry (data-model.md §7). The harness owns lifecycle: create →
# seed (identity recorded) → shared within one invocation → teardown.
# Container fixtures are named rdlt-bench-<id>; prepare scripts rely on that.
#
# Three same-conditions benchmark fixtures back the e2e matrix (feature 018,
# research D-07; the `oracle` store joined with 032's sixth cell), plus the
# exempt harness self-test `none`:
#
#   pg     — ONE postgres:16 container. Database `src` is seeded 1M×12 (the
#            `events` table) plus a 50%-changed `events_v2` for the dedup
#            cell; EMPTY per-product destination databases dest_rdlt/dest_dlt/
#            dest_airbyte are created in the same seed. Per-run reset recreates
#            every destination database's user schemas (drop/recreate), so each
#            arm starts from an identical empty destination.
#   rustfs — ONE RUSTFS container (pin 1.0.0-beta.11). Bucket `raw` is seeded
#            once per session with 200k nested jsonl (gen_jsonl.py); bucket
#            `lake` receives per-product prefixes (lake/rdlt, lake/dlt,
#            lake/airbyte). The lake prefixes need no explicit reset seam — the
#            file destination's Replace mode is the ownership-precise prefix
#            truncation.
#   oracle — ONE Oracle Database 23ai Free container, same image tag the Oracle
#            connector's live suite pins. Schema RDLT holds EVENTS, 200k×12 —
#            the Oracle mirror of pg's `events`. Read-only.
#
# A cross-store cell (postgres source → s3 destination, or the reverse) lists
# BOTH fixtures; the harness brings both up and resets both before each run.
# The non-primary store is addressed by its fixed port in the pipeline spec.

# Shared across every postgres_container fixture (they differ only by port). A
# fixture may still state its own `image`/`conn` to override.
[defaults]
postgres_image = "postgres:16"
postgres_conn = "postgresql://postgres:postgres@127.0.0.1:{{port}}/postgres"

# Reusable blocks; a fixture opts in with `reset_sql = "@name"`.
[snippets]
# Per-run reset: recreate every per-product destination database's user
# schemas. Piped through psql's stdin so `\connect` can switch databases (the
# reset runs against all three destinations on the one server). Resetting an
# already-recorded arm's destination is harmless — its result was captured
# before the next reset — and it guarantees every arm meets an identical empty
# destination (research D-07).
reset_dest_schemas = '''
\c dest_rdlt
DO $$ DECLARE s text; BEGIN FOR s IN SELECT nspname FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname <> 'information_schema' LOOP EXECUTE format('DROP SCHEMA %I CASCADE', s); END LOOP; END $$;
CREATE SCHEMA public;
\c dest_dlt
DO $$ DECLARE s text; BEGIN FOR s IN SELECT nspname FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname <> 'information_schema' LOOP EXECUTE format('DROP SCHEMA %I CASCADE', s); END LOOP; END $$;
CREATE SCHEMA public;
\c dest_airbyte
DO $$ DECLARE s text; BEGIN FOR s IN SELECT nspname FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname <> 'information_schema' LOOP EXECUTE format('DROP SCHEMA %I CASCADE', s); END LOOP; END $$;
CREATE SCHEMA public;
'''

[[fixture]]
id = "selftest-none"
kind = "none"

# One postgres server: `src` (seeded source datasets) + three empty
# per-product destination databases. The `conn` points at `src` so the primary
# `{{conn}}` substitution addresses the source; destinations are addressed by
# their database name in the pipeline spec (fixed port 5439).
[[fixture]]
id = "pg"
kind = "postgres_container"
port = 5439
conn = "postgresql://postgres:postgres@127.0.0.1:5439/src"
seed_sql = "{{benches}}/harness/fixtures/seed_pg.sql"
reset_sql = "@reset_dest_schemas"

# One RUSTFS object store: `raw` seeded with the flagship 200k nested jsonl;
# `lake` created empty for per-product output prefixes. generate_sh also writes
# the file-source config the s3-source cells consume ({{data}}/files.yaml).
[[fixture]]
id = "rustfs"
kind = "container"
image = "docker.io/rustfs/rustfs:1.0.0-beta.11"
port = 19110
container_port = 9000
run_args = ["-e", "RUSTFS_ACCESS_KEY=rdlt-bench", "-e", "RUSTFS_SECRET_KEY=rdlt-bench-secret"]
generate_sh = "python3 {{benches}}/harness/fixtures/gen_jsonl.py 200000 {{data}}/rows.jsonl && python3 {{benches}}/harness/fixtures/seed_s3.py http://127.0.0.1:19110 rdlt-bench rdlt-bench-secret raw landed/rows.jsonl {{data}}/rows.jsonl && python3 {{benches}}/harness/fixtures/s3_bucket.py http://127.0.0.1:19110 rdlt-bench rdlt-bench-secret lake && printf 'streams:\n  - name: events\n    format: jsonl\n    path: \"landed/*.jsonl\"\n    location:\n      s3:\n        endpoint: \"http://127.0.0.1:19110\"\n        bucket: raw\n        access_key: rdlt-bench\n        secret_key: rdlt-bench-secret\n' > {{data}}/files.yaml"
hash = ["{{data}}/rows.jsonl"]

# One Oracle Database 23ai Free, pinned to the SAME tag the Oracle connector's
# live suite uses (rdlt-connectors repo, its common.rs fixture) — one
# Oracle version for the gate and for the bench. Seeded once per session with
# EVENTS 200k×12, the Oracle mirror of the pg `events` shape, so the two
# source cells differ in the SOURCE, not the data. Read-only: no reset seam
# (the pg fixture's reset_dest_schemas already covers every destination this
# cell writes, and `reset_sql` is refused on non-postgres kinds at load time).
#
# Readiness is NOT the harness's TCP probe: Oracle's listener accepts long
# before FREEPDB1 registers with it (ORA-12514 in the gap), so seed_oracle.sh
# does the real wait — the log line, THEN a live query — before it seeds.
#
# Port 15210 reads as 1521 in the house's five-digit style (5439 pg, 19110
# rustfs). No `conn`: the rdlt source document takes discrete host/port/service
# fields and the dlt arm needs a SQLAlchemy URL, so each consumer spells its own
# rather than overloading one `{{conn}}` string (the runner handles an absent
# `conn`). generate_sh therefore also writes the oracle source document the
# cell's pipeline references as `{{data}}/oracle.yaml` — the same shape the
# rustfs fixture uses for `files.yaml`, and the form the facade's
# `source: oracle: <path>` path form takes. The container name is deterministic
# (rdlt-bench-<id>), which is what lets the seed script exec into it.
#
# Startup is the slowest thing in the matrix (15-40 s typical, longer on a cold
# page cache); fixtures are shared across cells within one invocation, so it is
# paid once per session. The image declares no VOLUME (verified with
# `podman image inspect`), so the harness's `rm -f` teardown leaks no anonymous
# volume — the 029 flake amplifier does not apply here.
[[fixture]]
id = "oracle"
kind = "container"
image = "docker.io/gvenzl/oracle-free:23.26.2-slim-faststart"
port = 15210
container_port = 1521
run_args = [
  "-e", "ORACLE_PASSWORD=rdlt-bench-sys",
  "-e", "APP_USER=RDLT",
  "-e", "APP_USER_PASSWORD=rdlt-bench",
]
generate_sh = "sh {{benches}}/harness/fixtures/seed_oracle.sh rdlt-bench-oracle 15210 RDLT rdlt-bench 200000 {{data}}/oracle-identity.txt && printf 'host: 127.0.0.1\nport: 15210\nservice: FREEPDB1\nuser: RDLT\npassword: rdlt-bench\nstreams:\n  - name: events\n    table: EVENTS\n' > {{data}}/oracle.yaml"
hash = ["{{data}}/oracle-identity.txt"]
