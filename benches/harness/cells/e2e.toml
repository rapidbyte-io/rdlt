# The five-cell e2e matrix (feature 018, data-model §1). One flat file — the
# retired importance/taxonomy vocabulary is gone (the loader rejects it). Each
# cell is a comparable end-to-end pipeline: source data → product →
# destination, same seeded data and same destination server/store for every
# arm. The rdlt arm spawns its connectors as separate release binaries over
# the connector protocol (`connector:` refs; the bins come from `{{bins}}` =
# <target>/release, unconditionally — a measured cell spawns the shipped
# shape, same convention as `{{cli}}`; build them with `make connector-bins`,
# absent bins fail loud). `note` is the cell's claim, rendered as the matrix
# caption; `verify` pins destination row count = expected on every arm
# (FR-015). Competitors run their fastest honest configuration (dlt:
# connectorx for pg extraction — variant `dlt`; pyarrow retained as recorded
# context on pg-source cells — variant `dlt-pyarrow`). All competitor arms
# reach the host fixtures over `network = "host"` at their fixed ports.
# Airbyte arms retired 2026-08-11 with the D1 swap (RESULTS.md policy log) —
# they were floor-dominated context (~45–60 s job wall regardless of dataset)
# and never carried a bar; the Oracle cell keeps its own.

# ---------------------------------------------------------------------------
# pg-to-pg-1m — Postgres → Postgres, 1M rows, full replace.
# ---------------------------------------------------------------------------
[[cell]]
id = "pg-to-pg-1m"
fixtures = ["pg"]
pipeline = "harness/cells/pipelines/pg-to-pg.yaml"
note = "Postgres → Postgres, 1M×12 rows, full replace — the everyday relational table copy, connectors spawned over the connector protocol."
[cell.verify]
events = 1_000_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_pg_pg.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "connectorx", "events"]
network = "host"
[[cell.competitor]]
variant = "dlt-pyarrow"
args = ["pipeline_pg_pg.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "pyarrow", "events"]
network = "host"

# ---------------------------------------------------------------------------
# pg-to-s3parquet-1m — Postgres → Parquet on S3, 1M rows, full replace.
# ---------------------------------------------------------------------------
[[cell]]
id = "pg-to-s3parquet-1m"
fixtures = ["pg", "rustfs"]
pipeline = "harness/cells/pipelines/pg-to-s3parquet.yaml"
note = "Postgres → Parquet on S3, 1M×12 rows, full replace — relational extract to a lake, connectors spawned over the connector protocol."
# Bytes each arm LEFT BEHIND, next to how long it took. Without this the cell
# compared a compressed artifact against an uncompressed one and reported it as
# parity. Untimed, run after the timed runs, and recorded as ABSENT (never
# zero) if it cannot reach the store.
artifact_bytes_sh = "python3 {{benches}}/harness/fixtures/s3_prefix_bytes.py http://127.0.0.1:19110 lake rdlt/ rdlt-bench rdlt-bench-secret"
[cell.verify]
events = 1_000_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_pg_s3parquet.py", "{{conn}}", "connectorx", "events", "http://127.0.0.1:19110", "rdlt-bench", "rdlt-bench-secret", "lake", "dlt"]
network = "host"
artifact_bytes_sh = "python3 {{benches}}/harness/fixtures/s3_prefix_bytes.py http://127.0.0.1:19110 lake dlt/ rdlt-bench rdlt-bench-secret"
[[cell.competitor]]
variant = "dlt-pyarrow"
# Its OWN prefix. Both dlt variants used to write to lake/dlt/, so the two arms
# shared one set of objects and whichever ran second determined what a
# per-prefix measurement would attribute to both. Timing was unaffected —
# each arm still ran its own pipeline — but bytes-written per arm could not
# mean anything until the arms stopped overwriting each other.
args = ["pipeline_pg_s3parquet.py", "{{conn}}", "pyarrow", "events", "http://127.0.0.1:19110", "rdlt-bench", "rdlt-bench-secret", "lake", "dlt-pyarrow"]
network = "host"
artifact_bytes_sh = "python3 {{benches}}/harness/fixtures/s3_prefix_bytes.py http://127.0.0.1:19110 lake dlt-pyarrow/ rdlt-bench rdlt-bench-secret"

# ---------------------------------------------------------------------------
# s3jsonl-to-pg-200k — nested JSONL on S3 → Postgres, 200k records, replace.
# ---------------------------------------------------------------------------
[[cell]]
id = "s3jsonl-to-pg-200k"
fixtures = ["rustfs", "pg"]
pipeline = "harness/cells/pipelines/s3jsonl-to-pg.yaml"
note = "Nested JSONL on S3 → Postgres, 200k records, full replace — semi-structured ingestion with child-table shredding, connectors spawned over the connector protocol."
# The shred lands a child table too; declaring both is what makes the arm
# comparable with a competitor that moves only what it claims.
[cell.verify]
events = 200_000
events__tags = 400_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_s3jsonl_pg.py", "http://127.0.0.1:19110", "rdlt-bench", "rdlt-bench-secret", "raw", "landed/*.jsonl", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt"]
network = "host"

# ---------------------------------------------------------------------------
# s3jsonl-to-s3parquet-200k — nested JSONL on S3 → Parquet on S3, 200k records.
# ---------------------------------------------------------------------------
[[cell]]
id = "s3jsonl-to-s3parquet-200k"
fixtures = ["rustfs"]
pipeline = "harness/cells/pipelines/s3jsonl-to-s3parquet.yaml"
note = "Nested JSONL on S3 → Parquet on S3, 200k records, full replace — lake file-format conversion, connectors spawned over the connector protocol."
[cell.verify]
events = 200_000
events__tags = 400_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_s3jsonl_s3parquet.py", "http://127.0.0.1:19110", "rdlt-bench", "rdlt-bench-secret", "raw", "landed/*.jsonl", "lake", "dlt"]
network = "host"

# ---------------------------------------------------------------------------
# pg-to-pg-dedup-1m — Postgres → Postgres, keep-in-sync by id (LOAD 2 measured).
# The rdlt arm's LOAD 1 (untimed) runs via prepare_sh against the load-1 spec;
# the measured pipeline re-delivers the 50%-changed rows and dedups by id. The
# dlt arm mirrors the two loads inside its script and times LOAD 2 only.
# ---------------------------------------------------------------------------
[[cell]]
id = "pg-to-pg-dedup-1m"
fixtures = ["pg"]
pipeline = "harness/cells/pipelines/pg-to-pg-dedup.yaml"
prepare_sh = "cd {{workdir}} && {{cli}} run {{benches}}/harness/cells/pipelines/pg-to-pg-dedup-load1.yaml"
note = "Postgres → Postgres, 1M rows, keep-in-sync by id — LOAD 2 measured: full re-delivery with 50% of rows changed, deduped by id, connectors spawned over the connector protocol. Both products run the same full-redelivery-plus-dedup regime (research D-08)."
[cell.verify]
events_merged = 1_000_000
[[cell.competitor]]
variant = "dlt"
args = ["pipeline_pg_pg_dedup.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "connectorx", "events", "events_v2"]
network = "host"
[[cell.competitor]]
variant = "dlt-pyarrow"
args = ["pipeline_pg_pg_dedup.py", "{{conn}}", "postgresql://postgres:postgres@127.0.0.1:5439/dest_dlt", "pyarrow", "events", "events_v2"]
network = "host"
