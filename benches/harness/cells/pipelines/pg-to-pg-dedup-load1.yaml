# LOAD 1 of the dedup cell — the untimed setup the measured pg-to-pg-dedup.yaml
# builds on. Run by that cell's prepare_sh (`cd {{workdir}} && rdlt run …`), so
# its conns are hardcoded (fixed port 5439) — this file is NOT rendered by the
# harness template pass. Reads src.events and merges by id into dest_rdlt's
# `events_merged` table; LOAD 2 then re-delivers the 50%-changed rows over it.
# Both loads are QUERY streams under the same neutral stream name: a query
# stream may not share a name with any table reflected from the source schema,
# and LOAD 2's stream must land in the table LOAD 1 populated.
pipeline: bench-pg-to-pg-dedup-load1
# Resolve under target/, not beside this committed spec: the spec is not
# template-rendered, so a relative leaf would retain its lock/WAL residue in
# benches/harness/cells/pipelines after every benchmark.
workdir: ../../../../target/bench/pg-to-pg-dedup-load1
write_mode:
  merge:
    key: [id]
source:
  connector:
    id: io.rapidbyte.postgres
    config:
      conn: "postgresql://postgres:postgres@127.0.0.1:5439/src"
      # Deliver ONLY the declared query stream: an absent `tables` would
      # add every table in the schema alongside it.
      tables: []
      queries:
        - name: events_merged
          sql: "SELECT * FROM events"
          primary_key: [id]
destination:
  connector:
    id: io.rapidbyte.postgres
    config:
      conn: "host=127.0.0.1 port=5439 user=postgres password=postgres dbname=dest_rdlt"
      dataset: bench
      merge_strategy: upsert
