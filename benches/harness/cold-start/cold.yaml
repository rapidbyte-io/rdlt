# Standalone one-row cold-start pipeline (instruments track, relocated from the
# retired `cold-start` benchmark cell — archive commit 40841ab). The
# check-cold-start.sh harness fills @FILES@ and @WORK@ per run and asserts the
# release binary starts this pipeline in <= 40 ms median. Since 044 both arms
# are the REFERENCE connector spelled in the frozen `connector:` vocabulary —
# the engine's own gate cannot lean on the seven first-party connectors once
# they live in their sibling repo — resolved off PATH (the script prepends the
# release dir), so the measured median still includes two spawn+handshakes and
# the wire, exactly the shape the 043 D1 swap pinned.
pipeline: cold-start
workdir: @WORK@/.rdlt-cold
source:
  connector:
    id: io.rapidbyte.reference
    config: {path: "@FILES@"}
destination:
  connector:
    id: io.rapidbyte.reference
    config: {path: "@WORK@/cold-out"}
