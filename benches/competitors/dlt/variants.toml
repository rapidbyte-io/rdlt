# The dlt competitor module (research R4, contract BH4). One pinned image
# (Dockerfile here), several variants. Which variants feed gated ratio bars is
# decided by bars.toml (it names the competitor per cell), not here. Bump the
# pin → re-measure every cell before quoting a multiple (the RESULTS.md version
# policy). `pin`/`image` are shared in [defaults]; a variant overrides either.

[defaults]
pin = "dlt 1.29.0"
image = "rdlt-baseline"

[[variant]]
id = "dlt"

[[variant]]
id = "dlt-pyarrow"

[[variant]]
id = "dlt-connectorx"
