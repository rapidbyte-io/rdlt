# Fixture registry (data-model.md §2). The harness owns lifecycle: create →
# seed (identity recorded) → shared within one invocation → teardown.
# Container fixtures are named rdlt-bench-<id>; prepare scripts rely on that.
#
# P0 keeps three fixtures: the harness self-test `none`, plus `pg-src` and
# `file-s3` as the seeds P2's reshape (T016) grows into the two same-conditions
# fixtures (`pg` with per-product destination databases, `rustfs` with `raw` +
# `lake` buckets). The 10 legacy fixtures were retired in the migration commit
# (archive commit 40841ab).

# Shared across every postgres_container fixture (they differ only by port). A
# fixture may still state its own `image`/`conn` to override.
[defaults]
postgres_image = "postgres:16"
postgres_conn = "postgresql://postgres:postgres@127.0.0.1:{{port}}/postgres"

# Reusable blocks; a fixture opts in with `reset_sql = "@name"`.
[snippets]
# Drop the per-run destination schemas (raw%) a load recreates.
drop_raw_schemas = "DO $$ DECLARE s text; BEGIN FOR s IN SELECT schema_name FROM information_schema.schemata WHERE schema_name LIKE 'raw%' LOOP EXECUTE 'DROP SCHEMA ' || quote_ident(s) || ' CASCADE'; END LOOP; END $$;"

[[fixture]]
id = "selftest-none"
kind = "none"

# Postgres source (feature 005 datasets); P2 grows this into the `pg` fixture
# with empty per-product destination databases on the same server.
[[fixture]]
id = "pg-src"
kind = "postgres_container"
port = 5439
seed_sql = "{{benches}}/fixtures/seed_pg.sql"
reset_sql = "@drop_raw_schemas"

# RUSTFS object store (015). The flagship 200k jsonl dataset is seeded INTO the
# bucket; P2 grows this into the `rustfs` fixture with `raw` + `lake` buckets.
[[fixture]]
id = "file-s3"
kind = "container"
image = "docker.io/rustfs/rustfs:1.0.0-beta.11"
port = 19110
container_port = 9000
run_args = ["-e", "RUSTFS_ACCESS_KEY=rdlt-bench", "-e", "RUSTFS_SECRET_KEY=rdlt-bench-secret"]
generate_sh = "python3 {{benches}}/fixtures/gen_jsonl.py 200000 {{data}}/rows.jsonl && python3 {{benches}}/fixtures/seed_s3.py http://127.0.0.1:19110 rdlt-bench rdlt-bench-secret raw landed/rows.jsonl {{data}}/rows.jsonl && printf 'streams:\n  - name: events\n    format: jsonl\n    path: \"landed/*.jsonl\"\n    location:\n      s3:\n        endpoint: \"http://127.0.0.1:19110\"\n        bucket: raw\n        access_key: rdlt-bench\n        secret_key: rdlt-bench-secret\n' > {{data}}/files.yaml"
hash = ["{{data}}/rows.jsonl"]
