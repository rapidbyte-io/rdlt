# Fixture registry (data-model.md §2). The harness owns lifecycle: create →
# seed (identity recorded) → shared within one invocation → teardown.
# Container fixtures are named rdlt-bench-<id>; prepare scripts rely on that.

[[fixture]]
id = "selftest-none"
kind = "none"

# -- e2e ---------------------------------------------------------------------

[[fixture]]
id = "jsonl-200k"
kind = "generated_files"
generate_sh = "python3 {{benches}}/fixtures/gen_jsonl.py 200000 {{data}}/rows.jsonl && printf 'streams:\n  - name: events\n    format: jsonl\n    path: \"{{data}}/rows.jsonl\"\n' > {{data}}/files.yaml"
hash = ["{{data}}/rows.jsonl"]

[[fixture]]
id = "parquet-200k"
kind = "generated_files"
generate_sh = "sh {{benches}}/fixtures/gen_parquet.sh {{cli}} {{data}} {{benches}}"
hash = ["{{data}}/rows.jsonl"]

[[fixture]]
id = "cold-one-row"
kind = "generated_files"
generate_sh = "printf '{\"id\":1,\"name\":\"one\"}\n' > {{data}}/one.jsonl && printf 'streams:\n  - name: events\n    format: jsonl\n    path: \"{{data}}/one.jsonl\"\n' > {{data}}/cold-files.yaml"
hash = ["{{data}}/one.jsonl"]

# REST→PG: a Postgres destination container PLUS the mock API sidecar (the
# server pre-renders pages; the benchmark measures the clients).
[[fixture]]
id = "rest-pg"
kind = "postgres_container"
image = "postgres:16"
port = 5440
conn = "postgresql://postgres:postgres@127.0.0.1:5440/postgres"
reset_sql = "DO $$ DECLARE s text; BEGIN FOR s IN SELECT schema_name FROM information_schema.schemata WHERE schema_name LIKE 'raw%' LOOP EXECUTE 'DROP SCHEMA ' || quote_ident(s) || ' CASCADE'; END LOOP; END $$;"
service_sh = "cd {{repo}} && cargo run -q --release -p rdlt-source-rest --example mock_api"
ready_port = 8642
generate_sh = "printf 'base_url: http://127.0.0.1:8642\nstreams:\n  - name: events\n    path: /events\n    pagination: {type: page, page_param: page, start: 1}\n' > {{data}}/rest.yaml"

