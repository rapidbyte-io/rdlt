# Enforcement bars — empty by design (feature 018, BR8 + constitution v1.1.0).
#
# Bars return measurement-first: after the first recorded three-way session
# (rdlt / dlt / Airbyte) lands, at most one bar per cell is added here, each set
# below its cited session floor and each carrying a policy-log entry in
# benches/RESULTS.md. Until then the matrix is measured and reported, never
# gated. Cross-validation requires only that every bar names an existing cell.
#
# The 8 bars retired by the matrix rebuild (jsonl-duckdb-200k ratio + RSS,
# shred-only-200k, rest-pg-100k, parquet-passthrough, pg-wide-duckdb-1m,
# pg-wide-pg-1m, cold-start) are recorded in the RESULTS.md policy log with
# their final values and the archive commit (40841ab). The cold-start absolute
# check now lives on the instruments track (benches/harness/check-cold-start.sh).

# 2026-08-11 — the D1 swap (ADR 0001): the spawned-connector recordings are
# the benchmark identity. The four bars below were minted 2026-08-10 from TWO
# recorded sessions (2026-08-07 / 2026-08-10) under the ids
# `<cell>-remote`; with the swap they are re-keyed to the base ids they now
# govern — values, floors and policy citations UNCHANGED. The four bars that
# previously bound these ids (minted 2026-07-25 from the in-process
# recordings) retired with their cells; each carried the SAME value, because
# the 2026-08-10 minting deliberately MIRRORED the in-process values rather
# than hugging the higher spawned-mode floors — the claim enforced is that
# running the connectors as separate processes does not cost the flagship
# bars. Their derivation history (including the s3parquet bar's
# held-at-45-not-tightened record and its falsified "can only rise" claim,
# amended 2026-08-07) lives in the RESULTS.md policy log and in this file's
# git history.
#
# Two-session floors behind each bar, both sessions clearing every bar:
# pg-to-pg-1m 9.50x -> 10.13x; s3jsonl-to-pg-200k 60.0x -> 78.4x;
# s3jsonl-to-s3parquet-200k 52.3x -> 57.1x; pg-to-pg-dedup-1m 2.42x ->
# 2.62x. The narrowest margin is the s3parquet cell's 52.3x against 45
# (x1.16) — the same margin 041 recorded, held again 2026-08-10 at 57.1x.
# `pg-to-s3parquet-1m` stays UNBARRED: a near-parity cell (1.75x / 1.75x
# across the two sessions) is reported, not gated — the same rule that kept
# it unbarred before the swap.

[[bar]]
cell = "pg-to-pg-1m"
kind = "ratio_vs"
competitor = "dlt"
min_ratio = 4.0
policy = "RESULTS.md policy log 2026-08-10 (remote bars): two-session floors 9.50x (2026-08-07), 10.13x (2026-08-10)"

[[bar]]
cell = "s3jsonl-to-pg-200k"
kind = "ratio_vs"
competitor = "dlt"
min_ratio = 40.0
policy = "RESULTS.md policy log 2026-08-10 (remote bars): two-session floors 60.0x (2026-08-07, warm-up-inflated median), 78.4x (2026-08-10)"

[[bar]]
cell = "s3jsonl-to-s3parquet-200k"
kind = "ratio_vs"
competitor = "dlt"
min_ratio = 45.0
policy = "RESULTS.md policy log 2026-08-10 (remote bars): two-session floors 52.3x (2026-08-07), 57.1x (2026-08-10)"

[[bar]]
cell = "pg-to-pg-dedup-1m"
kind = "ratio_vs"
competitor = "dlt"
min_ratio = 2.0
policy = "RESULTS.md policy log 2026-08-10 (remote bars): two-session floors 2.42x (2026-08-07), 2.62x (2026-08-10)"
