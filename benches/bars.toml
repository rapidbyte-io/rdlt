# Enforcement bars — empty by design (feature 018, BR8 + constitution v1.1.0).
#
# Bars return measurement-first: after the first recorded three-way session
# (rdlt / dlt / Airbyte) lands, at most one bar per cell is added here, each set
# below its cited session floor and each carrying a policy-log entry in
# benches/RESULTS.md. Until then the matrix is measured and reported, never
# gated. Cross-validation requires only that every bar names an existing cell.
#
# The 8 bars retired by the matrix rebuild (jsonl-duckdb-200k ratio + RSS,
# shred-only-200k, rest-pg-100k, parquet-passthrough, pg-wide-duckdb-1m,
# pg-wide-pg-1m, cold-start) are recorded in the RESULTS.md policy log with
# their final values and the archive commit (40841ab). The cold-start absolute
# check now lives on the instruments track (benches/check-cold-start.sh).

# Bars re-derived 2026-07-25 from the post-019 recorded three-way session
# (15/15 arms, rowcount-verified; artifacts in benches/results/). One bar per
# cell, each set below its recorded floor.
#
# FOUR cells carry a bar: pg-to-pg-1m (13.2× recorded), s3jsonl-to-pg-200k
# (95.0×), s3jsonl-to-s3parquet-200k (63.6×), and pg-to-pg-dedup-1m (2.6×).
#
# pg-to-s3parquet-1m carries NO bar — deliberately. It moved from parity to
# 1.7× once 019 made the parquet arms like-for-like, and one session on a
# newly-comparable cell is not a basis for a bar. The matrix reports it.
#
# The dedup cell's earlier "0.9× behind" standing is superseded and was never
# real: the cell delivered 3M rows against the competitor's 1M until 019 US1
# corrected it.

[[bar]]
cell = "pg-to-pg-1m"
kind = "ratio_vs"
competitor = "dlt"
min_ratio = 4.0
policy = "RESULTS.md policy log 2026-07-25 (bars): floor 5.3x (this session), 4.6x (2-way session same day)"

[[bar]]
cell = "s3jsonl-to-pg-200k"
kind = "ratio_vs"
competitor = "dlt"
min_ratio = 40.0
policy = "RESULTS.md policy log 2026-07-25 (bars): floor 55.3x (this session), 54.9x (2-way session same day)"

[[bar]]
cell = "s3jsonl-to-s3parquet-200k"
kind = "ratio_vs"
competitor = "dlt"
min_ratio = 45.0
policy = "RESULTS.md policy log 2026-07-25 (bars): floors 60.1x, 61.1x, and 63.6x (the post-019 session). CONFIRMED by that session — see the note below."

# Why this bar is held rather than re-derived (feature 019 US7, T078).
#
# rdlt's arm on this cell now writes snappy-compressed parquet; dlt's arm
# always did. That changes what the ratio MEANS more than what it is: the two
# arms were previously timed doing different amounts of work, with rdlt writing
# roughly four times the bytes, and the comparison flattered whichever side
# skipped the compression. It no longer does.
#
# The bar itself is not at risk, and the direction is the opposite of what was
# expected. Measured on this cell, interleaved, medians of 7, the ONLY variable
# being the compression change:
#
#     wall   0.97 -> 0.92 s  (-5.2%)
#     CPU    0.77 -> 0.81 s  (+5.2%)
#     RSS     213 ->   208 MB
#
# Compression costs CPU, as expected. But the bytes it saves are bytes not
# pushed to the object store, and on this cell that saving is larger than the
# encode — so rdlt's WALL, which is what the ratio divides, went DOWN. A ratio
# floor of 60.1x can only rise.
#
# CONFIRMED by the post-019 recorded session: 63.6x, ABOVE the 60.1x floor the
# bar was derived from. The isolated A/B above predicted the direction and the
# session bore it out.
#
# The bar STAYS at 45.0 rather than tightening toward 63.6x. Two reasons, both
# policy rather than caution: a bar sits below its cited floor by design, and
# this cell's spread in the confirming session was +/-20% — the widest of the
# five. A tighter bar wants a second session at that spread, not one.

# Set 2026-07-25 after the cell's scope was corrected (feature 019 US1): the
# source now delivers only its declared query stream, so the cell measures the
# 1M rows it claims instead of 3M. The superseded 0.8x "loss" is withdrawn in
# the policy log. This bar rests on ONE recorded session, unlike the three
# above; a second session may tighten it.
[[bar]]
cell = "pg-to-pg-dedup-1m"
kind = "ratio_vs"
competitor = "dlt"
min_ratio = 2.0
policy = "RESULTS.md policy log 2026-07-25 (dedup cell correction): floor 2.5x (corrected session, single session)"
