[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",      # xxhash-rust, the hash spec §25 names
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
exceptions = [
  # Built only: psm, under stacker, archives its assembly with it. LLVM's exception to Apache-2.0
  # only relaxes it.
  { crate = "ar_archive_writer", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
