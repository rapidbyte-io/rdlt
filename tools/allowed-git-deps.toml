# Git dependencies this workspace knowingly carries, and what each costs.
#
# An entry is not permission — it is a RECORD, and `unpublishable` is a claim
# tools/check-git-deps.sh verifies against the resolved dependency graph on
# every `make lint`. A dependency that spreads to another crate fails the check
# until the record is brought back into line.
#
# There is deliberately no entry shape for a dependency carrying both `git` and
# `version`: that form publishes successfully with the git source stripped, so
# it is refused outright rather than recorded.

# No entries: this workspace carries no git dependencies since the 044
# cut. (The snowflake fork's entry moved to the rdlt-connectors
# repository with its crate; that repo's own allowlist records it, plus
# the git dependencies its connectors hold on this repository.)
