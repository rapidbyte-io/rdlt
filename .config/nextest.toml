[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = "500ms"
# The S3 log store's tests on servers in containers need Docker: `just containers` runs them.
default-filter = "not (package(rdlt-log-store) & binary(containers))"

# Two containers at most at once: each of these tests starts a server of its own.
[test-groups]
containers = { max-threads = 2 }

[[profile.default.overrides]]
filter = "package(rdlt-log-store) & binary(containers)"
test-group = "containers"
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "package(rdlt-log-store) & binary(containers)"
test-group = "containers"
slow-timeout = { period = "120s", terminate-after = 8 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Simulation suites scale with RDLT_SIM_SEEDS; report them as slow, never terminate them.
[[profile.default.overrides]]
filter = "package(rdlt-sim)"
slow-timeout = { period = "60s" }

# The simulation tests that run seeds side by side take every core: nothing runs beside them.
[[profile.default.overrides]]
filter = "package(rdlt-sim) & binary(it) & (test(through_faults) | test(=exactly_once::seeds_that_once_found_a_defect_pass) | test(/^determinism::(the_same_seed_|a_seed_over_a_faulty_network)/) | test(many_threads))"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "package(rdlt-sim)"
slow-timeout = { period = "60s" }

# The failpoint sweep and the kill matrix run a pipeline in processes of their own, a hundred
# times and more a test: two minutes each here, several on a shared runner.
[[profile.default.overrides]]
filter = "package(rdlt-engine) & binary(crashes)"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "package(rdlt-engine) & binary(crashes)"
slow-timeout = { period = "120s", terminate-after = 8 }

# Mutation testing: each limit sits far enough above what its tests take beside another mutant's
# on a four-core runner that only a test hung on its mutant reaches it, and terminating that test
# fails it, which catches the mutant; no limit catches a mutant no assertion would.
[profile.mutants]
# Each of cargo-mutants' jobs runs tests of its own, a thread per core by default, so jobs side by
# side would push tests that pass unmutated past the limits below: four threads a job hold
# `just mutants-diff`'s jobs to a sixteen-core machine, and the nightly's jobs set two each.
test-threads = 4
slow-timeout = { period = "10s", terminate-after = 2 }
leak-timeout = "500ms"
# A mutant is caught by its first failing test: the tests still running then, which a mutant can
# slow past cargo-mutants' timeout, are terminated at once.
fail-fast = { max-fail = 1, terminate = "immediate" }
# The failpoint sweep and the kill matrix take minutes, and catch nothing the unit and integration
# tests do not first: they run in the test job, never against each mutant.
default-filter = "not (package(rdlt-engine) & binary(crashes)) & not (package(rdlt-log-store) & binary(containers))"

# The placement matrix runs on the real clock, and a scenario sleeps for seconds.
[[profile.mutants.overrides]]
filter = "test(/^placement::/)"
slow-timeout = { period = "30s", terminate-after = 2 }

# The host's tests that no connector inherits a descriptor another thread opens spawn hundreds of
# connectors each.
[[profile.mutants.overrides]]
filter = "package(rdlt-host) & binary(it) & test(/^descriptors::no_/)"
slow-timeout = { period = "30s", terminate-after = 2 }

# A read frame at the default bound for data is decoded to its end before it is refused.
[[profile.mutants.overrides]]
filter = "package(rdlt-host) & binary(it) & test(=decoded::a_read_frame_counted_beyond_its_bound_is_refused_within_it)"
slow-timeout = { period = "30s", terminate-after = 2 }

# The log's tests of partitions loading at once run every load of a matrix through every way
# receipts may come, one of them on the real clock.
[[profile.mutants.overrides]]
filter = "package(rdlt-engine) & test(/^wal::load::tests::concurrent::/)"
slow-timeout = { period = "30s", terminate-after = 2 }

# The certifier's command-line and spawned tests run the binary against real connectors and kill
# processes, more slowly beside other tests.
[[profile.mutants.overrides]]
filter = "package(rdlt-certify) & binary(it) & test(/^(cli|spawned|killed)::/)"
slow-timeout = { period = "30s", terminate-after = 2 }

# The SQLite differential tests run hundreds of cases, each syncing a database to disk: on a shared
# runner beside the rest of the suite one took over a minute unmutated, failing a shard's baseline.
# They wait long enough that only a hang times out; cargo-mutants' own timeout scales with it.
[[profile.mutants.overrides]]
filter = "package(rdlt-connector-reference) & test(/as_the_reference_does$/)"
slow-timeout = { period = "60s", terminate-after = 3 }

# The reference connectors' tests sync files and SQLite to disk, and four mutants tested at once
# contend for the disk: a test that takes a second alone can take ten. A timeout there would count a
# mutant as caught by no assertion, so these wait long enough that only a hang times out.
[[profile.mutants.overrides]]
filter = "package(rdlt-connector-reference)"
slow-timeout = { period = "30s", terminate-after = 2 }

# The engine's tests of a table that changes with every push load and replay hundreds of schema
# versions through a spawned destination: up to eight seconds alone, more beside other mutants'
# tests. They wait long enough that only a hang times out.
[[profile.mutants.overrides]]
filter = "package(rdlt-engine) & test(/through_a_served_destination$/)"
slow-timeout = { period = "30s", terminate-after = 2 }

# Each crate's mutants run its own tests first, where most are caught, then those of the packages
# that link it: `just mutants <crate>` tests with the crate's profile.
[profile.mutants-rdlt-engine]
inherits = "mutants"

[[profile.mutants-rdlt-engine.overrides]]
filter = "package(rdlt-engine)"
priority = 1

[profile.mutants-rdlt-connector]
inherits = "mutants"

[[profile.mutants-rdlt-connector.overrides]]
filter = "package(rdlt-connector)"
priority = 1

[profile.mutants-rdlt-adopt]
inherits = "mutants"

[[profile.mutants-rdlt-adopt.overrides]]
filter = "package(rdlt-adopt)"
priority = 1

[profile.mutants-rdlt-wire]
inherits = "mutants"

[[profile.mutants-rdlt-wire.overrides]]
filter = "package(rdlt-wire)"
priority = 1

[profile.mutants-rdlt-host]
inherits = "mutants"

[[profile.mutants-rdlt-host.overrides]]
filter = "package(rdlt-host)"
priority = 1

[profile.mutants-rdlt-certify]
inherits = "mutants"

[[profile.mutants-rdlt-certify.overrides]]
filter = "package(rdlt-certify)"
priority = 1

[profile.mutants-rdlt-connector-reference]
inherits = "mutants"

[[profile.mutants-rdlt-connector-reference.overrides]]
filter = "package(rdlt-connector-reference)"
priority = 1

[profile.mutants-rdlt-log-store]
inherits = "mutants"

[[profile.mutants-rdlt-log-store.overrides]]
filter = "package(rdlt-log-store)"
priority = 1
