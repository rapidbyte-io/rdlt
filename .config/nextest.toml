[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = "500ms"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Simulation suites scale with RDLT_SIM_SEEDS; report them as slow, never terminate them.
[[profile.default.overrides]]
filter = "package(rdlt-sim)"
slow-timeout = { period = "60s" }

[[profile.ci.overrides]]
filter = "package(rdlt-sim)"
slow-timeout = { period = "60s" }

# Mutation testing: every engine and contract test takes well under a second, so one still running
# after ten seconds is hung on the mutant. Terminating it fails the test, which catches the mutant.
[profile.mutants]
slow-timeout = { period = "5s", terminate-after = 2 }
leak-timeout = "500ms"

# The placement matrix runs on the real clock, and a scenario sleeps for seconds; the host's process
# tests spawn connectors, each within seconds.
[[profile.mutants.overrides]]
filter = "test(/^placement::/)"
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.mutants.overrides]]
filter = "package(rdlt-host) & test(/^process::/)"
slow-timeout = { period = "10s", terminate-after = 2 }

# The reference connectors' tests sync files and SQLite to disk, and four mutants tested at once
# contend for the disk: a test that takes a second alone can take ten. A timeout there would count a
# mutant as caught by no assertion, so these wait long enough that only a hang times out.
[[profile.mutants.overrides]]
filter = "package(rdlt-connector-reference)"
slow-timeout = { period = "30s", terminate-after = 2 }
