# Live container cells: each iceberg cell boots its own Polaris (JVM) +
# RUSTFS pair. Unbounded parallelism starts 6+ JVMs at once and health
# checks time out under the load — bound the group, everything else
# keeps full parallelism. The whole package rides the group (offline
# cells included — a scheduling simplification the membership pin in
# tests/cases/test_gating.rs makes explicit).
[test-groups.iceberg-live]
max-threads = 3

[[profile.default.overrides]]
filter = "package(rdlt-connector-iceberg)"
test-group = "iceberg-live"

# Live container cells: every oracle cell boots its own Oracle
# database, which is the heaviest fixture the gate has (~75 s to
# readiness, and a real RAM footprint). Unbounded parallelism started
# SIXTEEN of them at once and the machine thrashed — measured, not
# feared. Bounding the group is the fix; nextest runs a process per
# test, so no amount of in-process sharing can do it.
[test-groups.oracle-live]
max-threads = 3

[[profile.default.overrides]]
filter = "package(rdlt-connector-oracle)"
test-group = "oracle-live"

# The flake-recording profile (feature 020 US8).
#
# Six container flakes are recorded across features 015-019, each handled the
# same ad-hoc way: re-run it, watch it pass, move on. That convention loses the
# only thing that would settle whether a test is flaky or actually broken — how
# OFTEN it fails. This profile retries, and `benches/record-flakes.sh` appends
# nextest's own flaky classifications to a committed log, so the next
# intermittent failure is a data point rather than a judgement call.
#
# Deliberately NOT the default profile: retries in the gate would let a real
# intermittent bug pass as green, which is the failure mode 019 D-04 warns
# about. This profile is opt-in (`--profile flake`), and the gate of record
# still runs zero-retry.
[profile.flake]
retries = 2
fail-fast = false

[profile.flake.junit]
path = "junit.xml"
