[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = "500ms"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Simulation suites scale with RDLT_SIM_SEEDS; report them as slow, never terminate them.
[[profile.default.overrides]]
filter = "package(rdlt-sim)"
slow-timeout = { period = "60s" }

[[profile.ci.overrides]]
filter = "package(rdlt-sim)"
slow-timeout = { period = "60s" }
