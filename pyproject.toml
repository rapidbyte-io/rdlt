[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "rdlt"
description = "Move data exactly once: rdlt's pipelines, Python sources, transforms and connector SDK"
readme = "python/README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["pyarrow>=14", "pydantic>=2.7,<3"]
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.entry-points.pytest11]
rdlt = "rdlt.testing.plugin"

[dependency-groups]
dev = [
  "hypothesis==6.170.15",
  "mypy==2.4.1",
  "pyarrow==26.0.1",
  "pyarrow-stubs==20.0.0.20260819",
  "pydantic==2.14.3",
  "pytest==9.2.0",
  "pytest-timeout==2.4.0",
]
# Arrow producers the tests read from, where they publish wheels for the interpreter.
producers = ["duckdb==2.0.0", "pandas==3.1.1", "polars==2.1.0"]

[tool.uv]
package = false
default-groups = ["dev", "producers"]

[tool.maturin]
manifest-path = "crates/rdlt-python/Cargo.toml"
module-name = "rdlt._native"
python-source = "python"
python-packages = ["rdlt"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "examples/python"]
timeout = 120
# The installed package is the one tested: pytest puts no source directory before it on the path.
addopts = [
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-ra",
  "-m",
  "not network",
]
markers = ["network: installs from PyPI, with a wheel of this tree built"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "examples/python/*"]
# The rest of the repository holds Rust, and Markdown whose code blocks are examples.
extend-exclude = ["crates", "docs", "fuzz", "xtask"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "B",
  "BLE",
  "C4",
  "D",
  "E",
  "F",
  "FBT",
  "I",
  "N",
  "PERF",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = ["D105", "D107", "PLR0913", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The connector template is a project of its own, where `rdlt` sorts as a third party's.
"crates/rdlt-cli/templates/python/**" = ["I001"]
# An example's program prints what it shows.
"examples/python/*/main.py" = ["T201"]
"examples/python/**/test_*.py" = ["D103", "PLR2004", "S101", "S603"]
# A connector's failure classes are named as the Rust SDK names their kinds.
"python/rdlt/connector/_failures.py" = ["N818"]
"python/rdlt/_native.pyi" = ["A002"]
"python/tests/**" = ["D103", "PLR2004", "S101", "S603", "S608"]

[tool.pyright]
include = ["python", "conftest.py", "examples/python", "crates/rdlt-cli/templates/python"]
extraPaths = ["python", "crates/rdlt-cli/templates/python/src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
