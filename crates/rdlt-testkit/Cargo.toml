[package]
name = "rdlt-testkit"
description = "rdlt test kit: memory connectors, conformance suites, crash injection, and skip-not-fail container fixtures"
keywords = ["elt", "testing", "conformance", "connector", "mock"]
categories = ["development-tools::testing", "database"]
documentation = "https://docs.rs/rdlt-testkit"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-core = { workspace = true }
rdlt-connector = { workspace = true }
arrow = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
# The container-runtime probe + reclaim label (std-only). Off by default;
# consumers turn it on in their dev-dependency line where they gate on
# `runtime_available`. System-specific container fixtures live with their
# connectors (e.g. rdlt-connector-postgres's `fixtures` feature).
containers = []

[lints]
workspace = true
