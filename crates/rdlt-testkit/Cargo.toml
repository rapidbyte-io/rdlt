[package]
name = "rdlt-testkit"
description = "rdlt test kit: memory connectors, conformance suites, crash injection, and skip-not-fail container fixtures"
keywords = ["elt", "testing", "conformance", "connector", "mock"]
categories = ["development-tools::testing", "database"]
documentation = "https://docs.rs/rdlt-testkit"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-core = { workspace = true }
rdlt-connector = { workspace = true }
arrow = { workspace = true, features = ["json"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Container fixtures (behind `containers`): non-dev so consumers reach them
# through a dev-dependency; optional so testkit's default build stays lean.
testcontainers-modules = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[features]
# Postgres container fixtures + the runtime probe. Off by default (keeps the
# published lib build free of testcontainers); consumers turn it on in their
# dev-dependency line where they use `PgFixture`/`runtime_available`.
containers = ["dep:testcontainers-modules", "dep:tokio-postgres"]

[lints]
workspace = true
