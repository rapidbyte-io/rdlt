[package]
name = "rdlt-connector-file"
description = "rdlt file connectors: JSONL/Parquet/CSV source and destination over local or S3 locations, with resumable cursors"
keywords = ["elt", "parquet", "jsonl", "csv", "s3"]
categories = ["database", "encoding"]
documentation = "https://docs.rs/rdlt-connector-file"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-connector = { workspace = true, features = ["schema"] }
arrow = { workspace = true }
blake3 = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
memchr = { workspace = true }
glob = { workspace = true }
csv = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
object_store = { workspace = true }
futures = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
object_store = { workspace = true }
testcontainers = { workspace = true }
rdlt-testkit = { workspace = true, features = ["containers"] }
rdlt-engine = { workspace = true }
rdlt-connector-duckdb = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[features]
failpoints = ["rdlt-connector/failpoints"]
