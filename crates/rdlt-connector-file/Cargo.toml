[package]
name = "rdlt-connector-file"
description = "rdlt file connectors: JSONL/Parquet/CSV source and destination over local or S3 locations, with resumable cursors"
keywords = ["elt", "parquet", "jsonl", "csv", "s3"]
categories = ["database", "encoding"]
documentation = "https://docs.rs/rdlt-connector-file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
failpoints = ["rdlt-connector-sdk/failpoints"]

[dependencies]
# The ONE rdlt dependency (the one-dependency rule): the SPI is reached
# through the sdk's `spi` re-export; the object-store recoverability
# vocabulary arrives through the sdk's forward.
rdlt-connector-sdk = { workspace = true, features = ["schema", "object-store"] }
arrow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
memchr = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
rdlt-connector-duckdb = { workspace = true }
rdlt-engine = { workspace = true }
rdlt-testkit = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
# `test-util` only (037 US2 review round 1, I7): Cargo unifies this
# with the plain dependency's features for TEST builds alone, so
# `tokio::time::pause`/`advance` are reachable from the lease's
# in-file tests without adding a paused-clock mocking capability to
# the production binary.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
