[package]
name = "rdlt-connector-sdk"
description = "rdlt connector-builder SDK: the authoring framework over the connector SPI — config documents, the source shell, the destination session choreography"
keywords = ["elt", "connector", "sdk", "framework"]
categories = ["database"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-connector = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
rdlt-testkit = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[features]
# `config::schema_of` — JSON Schema generation for config documents.
# Opt-in so the framework carries no mandatory schemars edge, mirroring
# the SPI's feature spelling.
schema = ["dep:schemars"]
