[package]
name = "rdlt-log-store"
description = "Where an rdlt pipeline keeps its write-ahead logs: a local directory, or an S3 bucket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
object_store = { workspace = true, features = ["aws-base", "reqwest", "ring"] }
rdlt-connector.workspace = true
rdlt-engine = { workspace = true, features = ["object-store"] }
rdlt-host.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true

[dev-dependencies]
arrow-array.workspace = true
fail = { workspace = true, features = ["failpoints"] }
rdlt-connector-reference.workspace = true
rdlt-engine = { workspace = true, features = ["conformance", "failpoints", "object-store"] }
rdlt-testkit.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }
tokio-rustls.workspace = true

[lints]
workspace = true

[[test]]
name = "containers"
path = "tests/containers/main.rs"
