# The workspace clippy.toml settings, repeated because clippy reads only the nearest file,
# plus the rules that keep the engine deterministic under simulation.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
too-many-lines-threshold = 60

disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "use Env::now so simulation controls time" },
  { path = "std::time::Instant::now", reason = "use Env::instant so simulation controls time" },
  { path = "tokio::time::Instant::now", reason = "use Env::instant so simulation controls time" },
  { path = "tokio::time::sleep", reason = "use Env::sleep so simulation controls time" },
  { path = "tokio::time::sleep_until", reason = "use Env::sleep so simulation controls time" },
  { path = "tokio::spawn", reason = "spawn through TaskScope so every task has an owner" },
  { path = "tokio::task::spawn", reason = "spawn through TaskScope so every task has an owner" },
  { path = "tokio::task::spawn_blocking", reason = "run CPU work on Env::compute" },
  { path = "rayon::spawn", reason = "run CPU work on Env::compute" },
  { path = "getrandom::u64", reason = "use Env::random so simulation controls randomness" },
  { path = "getrandom::fill", reason = "use Env::random so simulation controls randomness" },
  { path = "getrandom::u32", reason = "use Env::random so simulation controls randomness" },
  { path = "getrandom::fill_uninit", reason = "use Env::random so simulation controls randomness" },
  { path = "std::hash::RandomState::new", reason = "random hash seeds break deterministic simulation" },
  { path = "std::time::Instant::elapsed", reason = "use Env::instant so simulation controls time" },
  { path = "std::time::SystemTime::elapsed", reason = "use Env::now so simulation controls time" },
  { path = "std::thread::sleep", reason = "use Env::sleep so simulation controls time" },
  { path = "std::thread::spawn", reason = "run CPU work on Env::compute" },
  { path = "tokio::time::timeout", reason = "race Env::sleep so simulation controls time" },
  { path = "tokio::time::timeout_at", reason = "race Env::sleep so simulation controls time" },
  { path = "tokio::time::interval", reason = "use Env::sleep so simulation controls time" },
  { path = "tokio::time::interval_at", reason = "use Env::sleep so simulation controls time" },
  { path = "tokio::runtime::Handle::spawn", reason = "spawn through TaskScope so every task has an owner" },
  { path = "tokio::task::spawn_local", reason = "spawn through TaskScope so every task has an owner" },
  { path = "tokio::task::JoinSet::spawn", reason = "spawn through TaskScope so every task has an owner" },
  { path = "rayon::join", reason = "run CPU work on Env::compute" },
  { path = "rayon::scope", reason = "run CPU work on Env::compute" },
  { path = "tokio::sync::watch::Receiver::changed", reason = "wakes waiters in a random order; use crate::watch" },
  { path = "tokio::sync::watch::Receiver::wait_for", reason = "wakes waiters in a random order; use crate::watch" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order breaks deterministic simulation; use BTreeMap" },
  { path = "std::collections::HashSet", reason = "iteration order breaks deterministic simulation; use BTreeSet" },
]
