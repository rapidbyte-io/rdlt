[package]
name = "rdlt-engine"
categories = [
    "asynchronous",
    "database",
]
description = "rdlt engine: shredder, schema registry, WAL, state, runtime, loader (deep module)"
documentation = "https://docs.rs/rdlt-engine"
keywords = [
    "arrow",
    "elt",
    "etl",
    "schema",
    "wal",
]
readme = "README.md"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
fs4 = { workspace = true }
rdlt-connector = { workspace = true }
rdlt-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = [
    "raw_value",
] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
# Arms the crash_point! sites for the crash sweep. Test-only: no gate ships it.
failpoints = [
    "rdlt-core/failpoints",
]

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true }
iai-callgrind = { workspace = true }
proptest = { workspace = true }
rdlt-connector-duckdb = { workspace = true, features = [
    "failpoints",
] }
rdlt-connector-file = { workspace = true, features = [
    "failpoints",
] }
rdlt-testkit = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "shred"
harness = false

[[bench]]
name = "iai_hotpath"
harness = false

[lints]
workspace = true
