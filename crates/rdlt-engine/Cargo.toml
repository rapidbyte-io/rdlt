[package]
name = "rdlt-engine"
description = "The rdlt data-movement engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Internals for the benchmarks and fuzz targets; not a public API.
bench = ["dep:arrow-ipc", "dep:schemars", "dep:stats_alloc", "tokio/rt-multi-thread"]
# Crash points at every durability step, for the failpoint sweep; never in a release.
failpoints = ["dep:fail", "fail/failpoints"]
# Write-ahead logs kept in an object store (`ObjectStoreWal`).
object-store = ["dep:futures-util", "dep:object_store"]
# The write-ahead log store's contract as tests another crate runs; not a public API.
conformance = []

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-ipc = { workspace = true, optional = true }
arrow-json.workspace = true
arrow-row.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
blake3.workspace = true
bytes.workspace = true
crc32c.workspace = true
chrono.workspace = true
fail = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
getrandom.workspace = true
memchr.workspace = true
object_store = { workspace = true, optional = true }
parking_lot.workspace = true
rayon.workspace = true
rdlt-connector = { workspace = true, features = ["wire"] }
rdlt-wire.workspace = true
ryu.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
stacker.workspace = true
stats_alloc = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
xxhash-rust.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "user"] }
rustix = { workspace = true, features = ["process", "thread", "time"] }

[dev-dependencies]
criterion.workspace = true
object_store.workspace = true
peak_alloc.workspace = true
proptest.workspace = true
rdlt-connector = { workspace = true, features = ["serve", "testing"] }
rdlt-connector-reference = { workspace = true, features = ["certify"] }
rdlt-host.workspace = true
rdlt-testkit.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[lints]
workspace = true

[[example]]
name = "crash_run"
required-features = ["failpoints"]

[[test]]
name = "crashes"
path = "tests/crashes/main.rs"
required-features = ["failpoints"]

[[test]]
name = "counted"
path = "tests/counted.rs"
required-features = ["bench"]

[[bench]]
name = "shred"
harness = false
required-features = ["bench"]

[[bench]]
name = "passthrough"
harness = false
required-features = ["bench"]

[[bench]]
name = "lowering"
harness = false
required-features = ["bench"]

[[bench]]
name = "normalized"
harness = false
required-features = ["bench"]

[[bench]]
name = "sqlite"
harness = false
required-features = ["bench"]

[[bench]]
name = "wide"
harness = false
required-features = ["bench"]

[[bench]]
name = "allocations"
harness = false
required-features = ["bench"]
