[package]
name = "rdlt-engine"
description = "The rdlt data-movement engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Internals for the benchmarks and fuzz targets (spec §21.2); not a public API.
bench = ["dep:arrow-ipc", "dep:schemars", "dep:serde_json"]

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-ipc = { workspace = true, optional = true }
arrow-json.workspace = true
arrow-row.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
chrono.workspace = true
getrandom.workspace = true
memchr.workspace = true
parking_lot.workspace = true
rayon.workspace = true
rdlt-connector.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sonic-rs.workspace = true
stacker.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
criterion.workspace = true
peak_alloc.workspace = true
proptest.workspace = true
rdlt-connector = { workspace = true, features = ["testing"] }
rdlt-connector-reference.workspace = true
schemars.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[lints]
workspace = true

[[bench]]
name = "shred"
harness = false
required-features = ["bench"]

[[bench]]
name = "passthrough"
harness = false
required-features = ["bench"]
