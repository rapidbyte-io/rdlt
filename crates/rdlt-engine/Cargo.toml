[package]
name = "rdlt-engine"
description = "rdlt engine: shredder, schema registry, WAL, state, runtime, loader (deep module)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-core = { workspace = true }
rdlt-connector = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
fs4 = { workspace = true }

[features]
failpoints = ["rdlt-core/failpoints"]

[dev-dependencies]
rdlt-testkit = { workspace = true }
rdlt-dest-parquet = { workspace = true, features = ["failpoints"] }
rdlt-dest-duckdb = { workspace = true, features = ["failpoints"] }
async-trait = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
iai-callgrind = "0.16"

[[bench]]
name = "shred"
harness = false

[[bench]]
name = "iai_hotpath"
harness = false

[lints]
workspace = true
