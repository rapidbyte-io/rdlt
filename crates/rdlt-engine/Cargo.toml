[package]
name = "rdlt-engine"
description = "The rdlt data-movement engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Internals for the benchmarks and fuzz targets (spec §21.2); not a public API.
bench = ["dep:arrow-ipc", "dep:schemars"]
# Crash points at every durability step, for the failpoint sweep; never in a release.
failpoints = ["dep:fail", "fail/failpoints"]

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-ipc = { workspace = true, optional = true }
arrow-json.workspace = true
arrow-row.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
crc32c.workspace = true
chrono.workspace = true
fail = { workspace = true, optional = true }
getrandom.workspace = true
memchr.workspace = true
parking_lot.workspace = true
rayon.workspace = true
rdlt-connector.workspace = true
rdlt-wire.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sonic-rs.workspace = true
stacker.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
xxhash-rust.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal", "user"] }

[dev-dependencies]
criterion.workspace = true
peak_alloc.workspace = true
proptest.workspace = true
rdlt-connector = { workspace = true, features = ["serve", "testing"] }
rdlt-connector-reference.workspace = true
rdlt-host.workspace = true
rdlt-testkit.workspace = true
schemars.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[lints]
workspace = true

[[example]]
name = "crash_run"
required-features = ["failpoints"]

[[test]]
name = "crashes"
path = "tests/crashes/main.rs"
required-features = ["failpoints"]

[[bench]]
name = "shred"
harness = false
required-features = ["bench"]

[[bench]]
name = "passthrough"
harness = false
required-features = ["bench"]
