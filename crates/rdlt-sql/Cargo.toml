[package]
name = "rdlt-sql"
description = "Stateless SQL transforms for rdlt streams: DataFusion's planner and expressions, evaluated by the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Internals for the fuzz targets; not a public API.
bench = []

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
datafusion-common.workspace = true
datafusion-expr.workspace = true
datafusion-functions.workspace = true
datafusion-optimizer.workspace = true
datafusion-physical-expr.workspace = true
datafusion-sql.workspace = true
parking_lot.workspace = true
rdlt-connector.workspace = true
rdlt-engine.workspace = true
regex.workspace = true
sqlparser.workspace = true
stacker.workspace = true
thiserror.workspace = true

[dev-dependencies]
datafusion.workspace = true
insta.workspace = true
proptest.workspace = true
rdlt-certify.workspace = true
rdlt-connector-reference.workspace = true
rdlt-engine = { workspace = true, features = ["bench"] }
rdlt-testkit.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
stats_alloc.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

# Used through DataFusion's SQL front end, for the growth of its stack that only a dependency on
# it can turn on.
[package.metadata.cargo-machete]
ignored = ["sqlparser"]

[[bench]]
name = "allocations"
harness = false
