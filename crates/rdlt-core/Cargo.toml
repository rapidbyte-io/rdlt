[package]
name = "rdlt-core"
description = "rdlt vocabulary: pure data contracts and semantic laws (ids, logical types, widening lattice, schemas, cursors, reports)"
keywords = ["elt", "schema", "arrow", "data", "types"]
categories = ["database", "data-structures"]
documentation = "https://docs.rs/rdlt-core"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Charter: pure data + pure functions. If it needs tokio, I/O, or arrow compute,
# it does not go in this crate.
[dependencies]
fail = { workspace = true, optional = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_yaml = { workspace = true }

[lints]
workspace = true

[features]
# Test infrastructure (crash sweep); never enabled in release builds.
failpoints = ["dep:fail", "fail/failpoints"]
