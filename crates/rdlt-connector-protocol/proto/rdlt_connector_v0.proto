// rdlt connector protocol v0 — FROZEN 2026-08-07, closing an
// experimental period on evidence: a standalone certifier driving any
// connector binary in any language against 29 fail-proven clauses plus
// a SIGKILL matrix, a non-Rust connector certified by that same
// certifier, and every throughput bar holding with the connectors out
// of process. The version NUMBER stays 0 — it is the handshake's
// negotiated identifier and moving it would break every shipped
// connector for a freeze that changes no byte; "v1" names the frozen
// CONTRACT. Binding from here: field numbers are never renumbered,
// repurposed, or recycled (a retired number is reserved); evolution is
// ADDITIVE ONLY — new fields take fresh numbers, new
// messages/RPCs/oneof arms/enum values may be added, nothing is
// removed, narrowed or given a second meaning; a receiver tolerates
// what a newer peer sends (an unrecognized Classification normalizes
// safe-loud to FATAL). The crate's README.md carries the rules in full
// and names the clauses the freeze makes load-bearing.
//
// A renumber has to be caught by a net that looks at bytes or at this
// text: it is silent at the Rust type level, and it is invisible
// end-to-end too, because both in-tree sides regenerate from THIS file
// and so agree with each other while disagreeing with the contract —
// only a third party working from an earlier copy breaks. So two nets
// guard it, covering different things: tests/cases/test_field_numbers.rs
// pins NUMBERING exhaustively, reading this file as text and checking
// every message's every field number (and every enum value, and the set
// of declared messages) against a frozen table; tests/cases/
// test_frames.rs pins ENCODING for five representative messages from
// both directions, byte for byte, proving the generated encoder really
// emits the numbers declared here.
//
// Trust model: config documents cross this LOCAL socket in the clear;
// a spawned connector inherits the operator's trust like any child
// process. Secret references are the recorded future for network
// transports.
//
// Payload discipline: *_json fields carry serde documents (their own
// format_version gates are the source of truth); arrow_ipc fields
// carry Arrow IPC stream bytes.
//
// credits: recorded fallback, not in v0 — a 2026-08-05 measurement
// bounded peak in-flight bytes to the h2 window plus <=2 chunks, so
// `Read` stays server-streaming with no client credit arm and no
// byte-budget/window field anywhere in this file: backpressure rides
// h2 flow control by design, with the engine's own byte-budget channel
// remaining the authority. A `ReadCredit` message is the documented
// escape hatch if a future measurement finds that bound insufficient —
// an ADDITIVE addition the freeze permits, not a message this file
// declares today.
syntax = "proto3";
package rdlt.connector.v0;

enum Classification {
  CLASSIFICATION_UNSPECIFIED = 0;
  TRANSIENT = 1;
  RATE_LIMITED = 2;
  FATAL = 3;
}
message ErrorFrame {
  Classification classification = 1;
  string message = 2;
  optional uint64 retry_after_ms = 3;
}

message HandshakeRequest {
  uint32 protocol_version = 1;   // client's pick within the stdout line's range
  string expected_role = 2;      // "source" | "destination"
  bytes config_json = 3;         // the connector config document
}
message HandshakeReply {
  oneof outcome {
    HandshakeOk ok = 1;
    ErrorFrame error = 2;        // typed refusal: bad role/version/config
  }
}
message HandshakeOk {
  string connector_id = 1;       // provider compares vs its resolution
  string connector_version = 2;
  bytes spec_json = 3;           // ConnectorSpec (name, version, config_schema)
  bytes capabilities_json = 4;   // DestinationCapabilities; empty for sources
  // e.g. "cursor" -> 2. v0 servers send an empty map; the dialing
  // client threads it through unread — negotiation belongs to the
  // feature that adds a second format version; see the README.
  map<string, uint32> state_format_versions = 5;
}
service Connector {
  rpc Handshake(HandshakeRequest) returns (HandshakeReply);
  rpc Check(CheckRequest) returns (CheckReply);
  // Config-free static identity: answers BEFORE any handshake —
  // it carries no session state, so the pre-handshake refusal does not
  // apply to it. spec_json is ConnectorSpec (name, version,
  // config_schema), served from the connector's statics alone.
  rpc Spec(SpecRequest) returns (SpecReply);
}
message CheckRequest {}
message CheckReply { oneof outcome { Empty ok = 1; ErrorFrame error = 2; } }
message Empty {}
message SpecRequest {}
message SpecReply { bytes spec_json = 1; }

service SourceService {
  rpc Streams(StreamsRequest) returns (StreamsReply);
  rpc Read(ReadRequest) returns (stream ReadFrame);
}
message StreamsRequest {}
message StreamsReply {
  oneof outcome { StreamList ok = 1; ErrorFrame error = 2; }
}
message StreamList { repeated bytes stream_spec_json = 1; }
message ReadRequest {
  bytes stream_spec_json = 1;
  optional bytes since_cursor_json = 2;
}
message ReadFrame {
  oneof frame {
    bytes raw_json = 1;              // PushPayload::RawJson
    // PushPayload::Arrow: Arrow IPC stream bytes carrying EXACTLY ONE
    // record batch per frame (one schema message, one record-batch
    // message) — the read-direction mirror of Write's one-batch rule.
    // This direction is server-streamed, so the refusal seat is the
    // CLIENT's: a conforming client refuses a frame carrying a second
    // batch message rather than silently taking the first. That
    // client-side posture is the dialing client's decode contract.
    bytes arrow_ipc = 2;
    bytes checkpoint_cursor_json = 3;
    ErrorFrame error = 4;            // terminal: read() returned Err
  }
}

service DestinationService {
  // The client MUST read replies concurrently with sending requests,
  // not write-everything-then-read: this server's reply channel is
  // BOUNDED (the sdk's REPLY_CHANNEL_BUDGET) and interleaves
  // PartClosedEvent notifications with request replies, so a client
  // that defers reading until every request is sent can wedge itself
  // against a full h2 flow-control window once enough replies queue up
  // unread on the server side.
  rpc OpenSession(stream SessionRequest) returns (stream SessionReply);
}
message SessionRequest {
  oneof request {
    Open open = 1;                   // MUST be first
    Ensure ensure = 2;
    Write write = 3;
    ExistingReceipt existing_receipt = 4;
    Replay replay = 5;
    Publish publish = 6;
    ReadState read_state = 7;
    Close close = 8;
  }
}
message Open { string pipeline = 1; string load_id = 2; }
message Ensure { bytes table_schema_json = 1; bytes write_mode_json = 2; }
// arrow_ipc carries EXACTLY ONE record batch as an Arrow IPC stream. A
// second batch message in the same stream is refused FATAL, not
// silently accepted with only the first written (measured live as
// silent row loss, not a hypothetical) — a multi-batch write is
// several Write frames, one batch each.
message Write { string table = 1; bytes arrow_ipc = 2; }
// Answered from the destination's OWN Backend::existing_receipt — a
// real, durable lookup, not a stub. The server does not run the
// commit choreography (deciding Replay vs Publish next) on the client's
// behalf: each of Ensure/Write/ExistingReceipt/Replay/Publish/
// ReadState/Close reaches its own Backend method independently, and
// the CALLER decides which to send next (the sdk's serve::destination
// module doc carries the full trust-split rationale).
message ExistingReceipt { string load_id = 1; uint64 commit_seq = 2; }
// Answered from Backend::replay — see ExistingReceipt's comment.
message Replay { bytes commit_meta_json = 1; bytes receipt_json = 2; }
message Publish { bytes commit_meta_json = 1; }
message ReadState { string pipeline = 1; }
// Ends the session: Backend::close() runs, the reply stream sends
// `closed`, then the stream ends — DEFINED behavior, not an oversight,
// for what happens on both sides of that end:
//
// - Any request frame a client sends AFTER `Close` is silently
//   discarded: the server's receiving half is already gone (dropped
//   along with the rest of this session's state) by the time such a
//   frame would arrive, so nothing observes it, successfully or
//   otherwise. The reply stream has already ended.
// - A `Close` request that itself fails answers `error` (an ErrorFrame)
//   INSTEAD of `closed` — but the reply stream still ends either way. A
//   client cannot distinguish "the backend closed cleanly" from "the
//   backend's close failed, and the session is now unrecoverably over"
//   from the RPC outcome alone. This is a deliberate v0 simplification:
//   a Close error is terminal for the session either way, and it is the
//   destination's OWN durability guards (the same ones ExistingReceipt's
//   comment above cites for the commit choreography) that make a fresh
//   re-run of the WHOLE session safe — not a retry of Close itself,
//   which this protocol does not offer.
message Close {}
message SessionReply {
  oneof reply {
    Empty opened = 1;
    Empty ensured = 2;
    Empty written = 3;
    ReceiptReply receipt = 4;        // ExistingReceipt answer
    Empty replayed = 5;
    Published published = 6;
    StateReply state = 7;
    Empty closed = 8;
    ErrorFrame error = 9;
    // Interleaved notification: every part already queued when a
    // Backend call RETURNS precedes that call's own reply above. A
    // part emitted asynchronously (outside any call this server
    // awaited directly) carries no such promise — it arrives as its
    // own part_closed reply as soon as the request loop next turns,
    // which may land before, after, or interleaved with any
    // particular request's reply.
    PartClosedEvent part_closed = 10;
  }
}
message ReceiptReply { optional bytes receipt_json = 1; }
message Published { bytes receipt_json = 1; }
message StateReply { optional bytes state_doc_json = 1; }
message PartClosedEvent { string table = 1; uint64 encoded_bytes = 2; string reason = 3; }
