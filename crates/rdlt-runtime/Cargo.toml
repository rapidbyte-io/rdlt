[package]
name = "rdlt-runtime"
description = "rdlt connector runtime: providers that resolve, spawn and supervise out-of-process connectors behind managed SPI adapters"
# The wire the crates below it speak is FROZEN (2026-08-07; ADR 0001
# D8's amendment). Publishing is a separate, owner-scheduled decision
# that did not move with the freeze — this stays false until that wave
# runs, in step with the protocol and client crates it composes.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The T6 smoke suite: tests that spawn the REAL connector binaries
# (file both roles, snowflake destination) through the provider. OFF by
# default — a plain workspace run must not depend on bins no workspace
# command builds. The Makefile's own line enables it AND sets
# RDLT_BUILD_CONNECTOR_BINS=1 so the suite's helper (re)builds the bins
# via cargo before spawning; without the env var the helper requires
# the bins to already exist and fails loudly, never silently.
spawn-bins = []

# The 041 spawn-latency instrument (Task 7's by-hand measurement):
# meaningful only with a real connector bin to spawn, so it rides the
# same gate as the spawn suite — a plain workspace command never
# compiles it.
[[example]]
name = "spawn_latency"
required-features = ["spawn-bins"]

[dependencies]
rdlt-connector = { workspace = true }
rdlt-connector-client = { workspace = true }
# For the stdout handshake line only (`handshake::Line`) — the one
# pre-gRPC artifact a spawned connector writes; everything after the
# line goes through the client crate.
rdlt-connector-protocol = { workspace = true }
# `process` rides the workspace feature list; `io-util` is this crate's
# own need (BufReader/read_line over the child's piped stdout).
tokio = { workspace = true, features = ["io-util"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# The T8 headline e2e drives the FACADE's build_pipeline over this
# crate's own provider — a dev-dep cycle (rdlt depends on rdlt-runtime),
# which cargo permits and which keeps the e2e where the spawn machinery
# lives. No connector features: the `connector:` variant is always
# present, and the bins are spawned, not compiled in.
rdlt = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
