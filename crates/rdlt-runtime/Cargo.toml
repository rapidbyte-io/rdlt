[package]
name = "rdlt-runtime"
description = "rdlt connector runtime: providers that resolve, spawn and supervise out-of-process connectors behind managed SPI adapters"
readme = "README.md"
# The wire the crates below it speak is FROZEN (2026-08-07), but
# publishing is a separate, owner-scheduled decision that did not move
# with the freeze — this stays false until then, in step with the
# protocol and client crates it composes.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Gates the spawn suites: tests that spawn the REAL reference connector
# binary (dual-role) through the provider. OFF by default — a plain
# workspace run must not depend on a bin no workspace command builds.
# The Makefile's own line enables it AND sets RDLT_BUILD_CONNECTOR_BINS=1
# so the suite's helper (re)builds the bin via cargo before spawning;
# without the env var the helper requires the bin to already exist and
# fails loudly, never silently.
spawn-bins = []

# The by-hand spawn-latency instrument: meaningful only with a real
# connector bin to spawn, so it rides the same gate as the spawn suites
# — a plain workspace command never compiles it.
[[example]]
name = "spawn_latency"
required-features = ["spawn-bins"]

[dependencies]
rdlt-connector = { workspace = true }
rdlt-connector-client = { workspace = true }
# For the stdout handshake line only (`handshake::Line`) — the one
# pre-gRPC artifact a spawned connector writes; everything after the
# line goes through the client crate.
rdlt-connector-protocol = { workspace = true }
# `process` rides the workspace feature list; `io-util` is this crate's
# own need (BufReader/read_line over the child's piped stdout).
tokio = { workspace = true, features = ["io-util"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
# The spawned-pipeline e2e drives the FACADE's Pipeline::from_document over this
# crate's own provider — a dev-dep cycle (rdlt depends on rdlt-runtime),
# which cargo permits and which keeps the e2e where the spawn machinery
# lives. No connector features: the `connector:` variant is always
# present, and the bins are spawned, not compiled in.
rdlt = { workspace = true }
# The ONE spawn scaffold: built_connector_bin locates and (re)builds
# the reference bin for the spawn suites — the mechanics live in the
# testkit once, never copied per crate.
rdlt-testkit = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }

[lints]
workspace = true
