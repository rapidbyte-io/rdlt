[package]
name = "rdlt-connector-iceberg"
description = "rdlt Iceberg destination: provider-agnostic REST catalog, snapshot-native exactly-once"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-connector = { workspace = true, features = ["schema"] }
iceberg = { workspace = true }
iceberg-catalog-rest = { workspace = true }
iceberg-storage-opendal = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-cast = { workspace = true }
parquet = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
reqwest = { workspace = true }
rdlt-engine = { workspace = true }
rdlt-testkit = { workspace = true, features = ["containers"] }
tempfile = { workspace = true }

[lints]
workspace = true

[features]
failpoints = ["rdlt-connector/failpoints"]
