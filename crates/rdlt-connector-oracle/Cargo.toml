[package]
name = "rdlt-connector-oracle"
description = "rdlt Oracle source: streaming reads into Arrow, watermark cursors"
# New connector, unpublished until the workspace's 0.3.0 wave.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
failpoints = ["rdlt-connector-sdk/failpoints"]

[dependencies]
# The sdk plus THE recorded driver exception (like duckdb's own
# driver). `oracle` wraps ODPI-C: it needs Oracle Client libraries at
# RUNTIME (not at build — ODPI-C compiles from vendored C source), and
# it is SYNCHRONOUS, so every call crosses `spawn_blocking`. The
# pure-Rust alternative was tried first and abandoned on measurement:
# specs/032-oracle/plan.md T005 records what each driver does with the
# same data.
rdlt-connector-sdk = { workspace = true, features = ["schema"] }
arrow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
oracle = { version = "0.6.3", features = ["chrono"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
# The statement timeout the read path enforces (JDBC ReadTimeout).
tokio = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
tokio = { workspace = true }
jsonschema = { workspace = true }
rdlt-engine = { workspace = true }
rdlt-testkit = { workspace = true }
rdlt-connector-duckdb = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }

[lints]
workspace = true
