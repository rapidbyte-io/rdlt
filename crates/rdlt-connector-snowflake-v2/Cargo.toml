[package]
name = "rdlt-connector-snowflake-v2"
description = "rdlt Snowflake destination, second generation: internal-stage parquet ingestion, sqlcore-planned merges, exactly-once units"
# Coexists UNCONSUMED beside generation 1 until the owner-decided swap;
# never published under this name.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
failpoints = ["rdlt-connector-sdk/failpoints"]

[dependencies]
# The ONE rdlt dependency (the one-dependency rule): the SPI is reached
# through the sdk's `spi` re-export. sqlcore is the RECORDED exception
# for SQL destinations — the shared merge core.
rdlt-connector-sdk = { workspace = true, features = ["schema"] }
rdlt-connector-sqlcore = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
# Parts travel as parquet.
parquet = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
snowflake-connector-rs = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
rdlt-connector-postgres = { workspace = true, features = ["destination", "fixtures"] }
rdlt-engine = { workspace = true }
rdlt-testkit = { workspace = true }
tempfile = { workspace = true }
tokio-postgres = { workspace = true }

[lints]
workspace = true
