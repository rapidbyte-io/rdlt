[package]
name = "rdlt-certify"
description = "rdlt connector certifier: spawns an out-of-process connector binary and certifies it against the conformance clauses over the wire"
# The wire this certifier drives is frozen, but publishing is a
# separate decision that moves with the protocol/client/runtime trio;
# until that decision is taken this stays false and the workspace dep entry
# stays path-only.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The certification cells that spawn the REAL reference connector bin.
# Off by default so a plain workspace run never depends on a bin no
# workspace command builds; the Makefile enables it with
# RDLT_BUILD_CONNECTOR_BINS=1 so the helper builds the bin before
# spawning, and without that variable a missing bin fails loudly.
spawn-bins = []
# The `rdlt-certify` CLI: clap plus a tokio runtime entry point. Behind
# `required-features` so no plain workspace command compiles the bin;
# the Makefile builds it explicitly, and the CLI suite enables
# `spawn-bins,bin` so cargo provides `CARGO_BIN_EXE_rdlt-certify`.
bin = ["dep:clap", "tokio/rt"]

[[bin]]
name = "rdlt-certify"
path = "src/bin/rdlt-certify.rs"
required-features = ["bin"]

[dependencies]
clap = { workspace = true, optional = true }
rdlt-runtime = { workspace = true }
# The session clauses re-dial the LIVE socket and send raw
# `OpenSession`s — moves the managed adapter never makes — so the
# certifier reaches under it to the client crate.
rdlt-connector-client = { workspace = true }
# The SPI `Destination` adapter the reused D-suite runs against.
async-trait = { workspace = true }
# P8 is judged by the typed Status code of the second `OpenSession`.
tonic = { workspace = true }
tokio-stream = { workspace = true }
# `ConnectorSpec`, the Spec reply P4 judges and path-only identity
# resolution reads.
rdlt-connector = { workspace = true }
# The S/D conformance suites are reused, not re-derived: the certifier
# feeds them a spawned, wire-driven SPI object.
rdlt-testkit = { workspace = true }
# The handshake line P1 parses, and the generated proto types the raw
# wire probe drives below the client adapters, so a misbehaving server
# cannot hide behind our own client's good manners.
rdlt-connector-protocol = { workspace = true }
# P5 decodes each `arrow_ipc` read frame to count its record batches on
# the wire bytes.
arrow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `process`/`time` ride the workspace feature list; `io-util` is this
# crate's own need (buffered line reads over a probe's piped stdout).
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tempfile = { workspace = true }
# `net` for the in-process rogue servers, which bind their own UDS
# listeners so the rogue suites spawn no bin; `test-util` for the P9
# rogue's paused clock, so its 10 s reclaim window elapses without
# wall time.
tokio = { workspace = true, features = ["net", "test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
# The test probe implements the testkit's async `TableProbe` trait.
async-trait = { workspace = true }

[lints]
workspace = true
