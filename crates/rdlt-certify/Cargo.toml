[package]
name = "rdlt-certify"
description = "rdlt connector certifier: spawns an out-of-process connector binary and certifies it against the conformance clauses over the wire"
# EXPERIMENTAL, like the protocol/client/runtime trio it drives (ADR
# 0001 D8): unpublished until the wire freezes. The workspace dep entry
# is path-only (no version key) for the same reason.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The certification suite: tests that spawn the REAL file connector bin
# through the certifier. OFF by default — a plain workspace run must not
# depend on bins no workspace command builds. The Makefile's own line
# enables it AND sets RDLT_BUILD_CONNECTOR_BINS=1 so the suite's helper
# (re)builds the bin via cargo before spawning; without the env var the
# helper requires the bin to already exist and fails loudly, never
# silently.
spawn-bins = []

[dependencies]
rdlt-runtime = { workspace = true }
# P8/P9 drive the LIVE socket directly — a second dial and a raw
# `OpenSession` are wire moves the managed adapter deliberately never
# makes, so the certifier reaches under it to the client crate.
rdlt-connector-client = { workspace = true }
# For implementing the SPI `Destination` adapter the D-reuse suite runs
# against (the settling `open`).
async-trait = { workspace = true }
# For judging the P8 refusal by its typed Status code, and the raw
# second `OpenSession` P8 sends.
tonic = { workspace = true }
tokio-stream = { workspace = true }
# For naming `ConnectorSpec` — the shape the provider's Spec reply
# carries, which P4 judges and path-only identity resolution reads.
rdlt-connector = { workspace = true }
# The S/D conformance suites are REUSED, not re-derived: the certifier
# feeds a managed (spawned, wire-driven) SPI object to the exact suites
# in-process connectors certify against.
rdlt-testkit = { workspace = true }
# For the stdout handshake line only (`handshake::Line`) — the P1 probe
# reads the one pre-gRPC artifact a spawned connector writes.
rdlt-connector-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `process`/`time` ride the workspace feature list; `io-util` is this
# crate's own need (BufReader/read_line over the probe's piped stdout).
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
# The test probe implements the testkit's async `TableProbe` trait.
async-trait = { workspace = true }

[lints]
workspace = true
