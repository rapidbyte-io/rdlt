[package]
name = "rdlt-certify"
description = "Conformance clauses for rdlt connectors over the wire protocol: a library, and the rdlt-certify binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rdlt-certify"
path = "src/main.rs"
required-features = ["kill"]

# The suite certifies the kill clauses, and runs the binary.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["kill"]

[features]
# The kill clauses, which load through an engine, killing the connector as it does.
kill = ["dep:arrow-cast", "dep:arrow-schema", "dep:rdlt-connector-reference", "dep:rdlt-engine"]

[dependencies]
arrow-array.workspace = true
arrow-cast = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
clap.workspace = true
rdlt-connector = { workspace = true, features = ["serve", "testing", "wire"] }
rdlt-connector-reference = { workspace = true, optional = true }
rdlt-engine = { workspace = true, optional = true }
rdlt-host.workspace = true
rdlt-wire.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream.workspace = true

[dev-dependencies]
http.workspace = true
hyper = { workspace = true, features = ["http2", "server"] }
hyper-util = { workspace = true, features = ["service", "tokio"] }
insta.workspace = true
rdlt-connector-reference.workspace = true
rdlt-testkit.workspace = true
rdlt-wire = { workspace = true, features = ["serve"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tonic = { workspace = true, features = ["server"] }
tower.workspace = true

[lints]
workspace = true
