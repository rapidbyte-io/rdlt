[package]
name = "rdlt-postgres"
description = "rdlt PostgreSQL connectors: binary-COPY-to-Arrow source and binary-COPY destination, one shared TLS/config home"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["source", "dest"]
source = []
dest = []
failpoints = ["rdlt-connector/failpoints"]

[dependencies]
rdlt-connector = { workspace = true }
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
iai-callgrind = "0.16"
proptest = { workspace = true }
rdlt-dest-duckdb = { workspace = true }
rdlt-engine = { workspace = true }
rdlt-testkit = { workspace = true }
tempfile = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "iai_pg"
harness = false
