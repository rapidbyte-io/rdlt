[package]
name = "rdlt-connector-v2"
description = "rdlt connector SPI, second generation: Source/Destination/LoadSession traits, the byte-budget record channel, capabilities, error taxonomy"
keywords = ["elt", "connector", "spi", "arrow", "data"]
categories = ["database", "asynchronous"]
readme = "README.md"
# Unpublished until the swap: publishing (and the published name) is the
# owner's call once every consumer has moved.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-core = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
object_store = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[features]
# The crash-sweep seam: connectors depend on the SPI alone, so arming fail
# points routes through this feature to the vocabulary crate that defines
# the `crash_point!` macro.
failpoints = ["rdlt-core/failpoints"]
# `schemars::JsonSchema` for the shared config types (Secret, PemSource,
# parquet options). Opt-in so the SPI carries no mandatory schemars edge;
# a connector that generates config schemas turns it on.
schema = ["dep:schemars"]
# The object-store vocabulary (one shared recoverability rule). Opt-in so
# only the connectors that reach an object store carry the dependency.
object-store = ["dep:object_store"]
