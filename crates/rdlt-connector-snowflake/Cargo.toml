[package]
name = "rdlt-connector-snowflake"
description = "rdlt Snowflake destination: key-pair auth, merge parity, staged and batched ingestion"
keywords = ["elt", "snowflake", "warehouse", "sql", "arrow"]
categories = ["database"]
documentation = "https://docs.rs/rdlt-connector-snowflake"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-connector = { workspace = true, features = ["schema", "object-store"] }
rdlt-connector-sqlcore = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
snowflake-connector-rs = { workspace = true }
serde_yaml = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
tokio = { workspace = true }
# The bulk path only: parts are written as parquet to the user's own bucket
# and read back by the service's COPY. Both are inert until a stage is
# configured.
parquet = { workspace = true }
object_store = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
rdlt-testkit = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
rdlt-engine = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[features]
failpoints = ["rdlt-connector/failpoints"]
