[package]
name = "rdlt-connector-snowflake"
description = "rdlt Snowflake destination: internal-stage parquet ingestion, sqlcore-planned merges, exactly-once units"
keywords = ["elt", "snowflake", "warehouse", "sql", "arrow"]
categories = ["database"]
documentation = "https://docs.rs/rdlt-connector-snowflake"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
failpoints = ["rdlt-connector-sdk/failpoints"]

[dependencies]
# The ONE rdlt dependency (the one-dependency rule): the SPI is reached
# through the sdk's `spi` re-export. sqlcore is the RECORDED exception
# for SQL destinations — the shared merge core.
rdlt-connector-sdk = { workspace = true, features = ["schema"] }
rdlt-connector-sqlcore = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
# Parts travel as parquet.
parquet = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
snowflake-connector-rs = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
rdlt-connector-postgres = { workspace = true, features = ["destination", "fixtures"] }
rdlt-engine = { workspace = true }
rdlt-testkit = { workspace = true }
tempfile = { workspace = true }
tokio-postgres = { workspace = true }

[lints]
workspace = true
