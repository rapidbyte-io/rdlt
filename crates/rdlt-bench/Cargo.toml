[package]
name = "rdlt-bench"
description = "rdlt dev benchmark harness: declarative cells -> run -> gate -> report"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rdlt-bench"
path = "src/main.rs"

# Runtime crates gain nothing from this manifest: the harness is dev-only and
# clap is its one dependency beyond the workspace's existing tree.
[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# The harness itself execs the built `rdlt` CLI; only the TEST suites parse
# the cell pipelines through the facade's Spec model (rendering, the parse,
# the connector ids), so it rides dev-deps. The connector `config:` blocks
# are validated by the connectors' own document gates in their repository.
rdlt = { workspace = true }

[lints]
workspace = true
