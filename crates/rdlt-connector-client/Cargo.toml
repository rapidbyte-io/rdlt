[package]
name = "rdlt-connector-client"
description = "rdlt out-of-process connector client: dial a served connector over UDS, run the handshake, map wire error frames back to SPI classifications"
# The wire contract was frozen 2026-08-07 and re-opened 2026-08-19 by
# the owner while the workspace is pre-release — the protocol crate's
# manifest carries the same dates. Publishing is a SEPARATE,
# owner-scheduled decision and did not move with either: this stays
# false until the owner schedules publication.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-connector = { workspace = true }
rdlt-core = { workspace = true }
# The sdk WITHOUT its `serve` feature: the wire `destination::Backend`
# implements the sdk's backend trait, and `open` boxes the SAME `Session<B>`
# generic the in-process path composes — the exactly-once commit
# choreography is reused by identical type, never reimplemented.
rdlt-connector-sdk = { workspace = true }
rdlt-connector-protocol = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
tokio = { workspace = true, features = ["net"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# `arrow` (not the SPI's arrow-array re-export) for the IPC stream
# reader: `source::Remote` decodes each `arrow_ipc` read frame's
# exactly-one batch — the client seat of the proto's one-batch rule.
arrow = { workspace = true }
bytes = { workspace = true }
# ReceiverStream feeds the destination session's bidi request stream.
tokio-stream = { workspace = true }

[dev-dependencies]
# The served counterpart the tests dial: this crate's own echo pair
# served in-process through the sdk's `run_on` seam.
rdlt-connector-sdk = { workspace = true, features = ["serve"] }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
# The rogue server fixture binds its own UDS listener (UnixListenerStream)
# to serve hand-crafted frames the sdk's encoder can never emit.
tokio-stream = { workspace = true }

[lints]
workspace = true
