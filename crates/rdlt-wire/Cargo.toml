[package]
name = "rdlt-wire"
description = "The wire protocol between rdlt and out-of-process connectors: messages, the Arrow codec and limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
flatbuffers.workspace = true
http-body.workspace = true
prost.workspace = true
nix = { workspace = true, optional = true, features = ["fs", "user"] }
rustls = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
webpki = { workspace = true, optional = true }

[features]
# The service's server stub, for a connector that serves the protocol.
serve = ["tonic/server"]
# The protocol's TLS, for connectors reached over the network.
tls = ["dep:nix", "dep:rustls", "dep:webpki"]

[dev-dependencies]
peak_alloc.workspace = true
proptest.workspace = true
rdlt-testkit.workspace = true

[lints]
workspace = true
