// The connector service: the handshake, and every operation a source or destination serves.
syntax = "proto3";

package rdlt.connector.v1;

import "rdlt/connector/v1/catalog.proto";
import "rdlt/connector/v1/destination.proto";
import "rdlt/connector/v1/source.proto";

// A connector, serving every role it supports.
//
// Its data calls are streams of their own, outside this service: a read of a partition, a write of
// a table and, where the handshake accepted the "published" feature, a read-back of every row a
// destination published to a table, for certification, which the engine never makes. Each stream
// carries frames of a 16-byte head, `len:u32le | kind:u8 | flags:u8 | 0:u16 | tag:u64le`, then
// `len` bytes: kind 1 is one Arrow IPC encapsulated message at the stream format's 64-byte
// alignment, its tag the schema epoch on a read and the segment on a write, its flags' bit 0 set
// for change rows and bit 1 for a dictionary; kind 2 is a push's JSON; kind 3 is one message of
// this package. The host's first frame is a message whose flags name the call (1 a read, 2 a write,
// 3 a read-back) and whose body is the call's start, a ReadStart, a WriteStart or a
// ReadPublishedRequest; the connector answers with a message head of the same flags and no body, or
// with the call's answer carrying its error. After it a read's host sends ReadControl messages and
// its connector ReadFrame messages, batches and JSON pushes; a write's host WriteFrame messages and
// batches, its connector WriteAck messages; a read-back's connector what a read's does but JSON. A
// spawned connector's streams are passed over the socket at its descriptor 3, the control
// connection first; a remote one's ride one HTTP/2 call, `/rdlt.connector.v1.Connector/Data`, of
// the control connection.
service Connector {
  // Agrees the protocol version, role and features, and answers who the connector is, before
  // it receives any configuration.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  // Configures the connector for the role agreed, once the host has checked who it is; every
  // other call needs it first.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  // Verifies connectivity and permissions.
  rpc Check(CheckRequest) returns (CheckResponse);
  // The source's catalog.
  rpc Discover(DiscoverRequest) returns (Catalog);
  // The partitions of a stream to read.
  rpc Plan(PlanRequest) returns (PlanResponse);
  // Reports cursors a destination committed: each a checkpoint a read sent this host, or the
  // cursor a read of its started from. A report of any other position is refused as transient,
  // with the code "position_unsent".
  rpc Committed(CommittedRequest) returns (CommittedResponse);
  // Opens a destination session.
  rpc Open(OpenRequest) returns (OpenResponse);
  // Applies a schema change.
  rpc ApplySchema(ApplySchemaRequest) returns (ApplySchemaResponse);
  // Commits a session's staged segments.
  rpc Commit(CommitRequest) returns (Receipt);
  // Closes a session.
  rpc Close(CloseRequest) returns (CloseResponse);
  // Proves both ends are alive.
  rpc Heartbeat(stream Ping) returns (stream Pong);
  // Tells where a source stands for a partition outside the engine, for certification; served
  // when the handshake accepted the "acknowledged" feature, which only a connector built and
  // served for certification does. The engine never calls it.
  rpc ReadAcknowledged(ReadAcknowledgedRequest) returns (ReadAcknowledgedResponse);
}

// The side of a connection a connector serves.
enum Role {
  // Never sent; a receiver refuses it.
  ROLE_UNSPECIFIED = 0;
  // A source.
  ROLE_SOURCE = 1;
  // A destination.
  ROLE_DESTINATION = 2;
}

// The limits each end enforces on what it receives.
//
// A limit left 0 is the protocol's default, but for dictionary_bytes, which has no default and
// is taken as sent. A handshake that sends no limits at all has every default.
//
// A sender cuts a batch to its receiver's frame_bytes, batch_rows and batch_values, so a peer
// may not set them below the protocol's minimums: 4194304 bytes, 1024 rows and 1048576 values.
// Nor may it set dictionary_bytes below 262144, a dictionary of some thousands of short values.
// A handshake naming a lower one, a dictionary_bytes left 0 included, is refused with
// `limit_below_minimum`.
message Limits {
  // Bytes in one frame.
  uint64 frame_bytes = 1;
  // Rows in one batch.
  uint64 batch_rows = 2;
  // Columns in one schema.
  uint64 schema_columns = 3;
  // Levels of nesting.
  uint64 nesting_depth = 4;
  // Bytes in one JSON push.
  uint64 json_push_bytes = 5;
  // Bytes in one cursor.
  uint64 cursor_bytes = 6;
  // Bytes in the configuration document.
  uint64 config_bytes = 7;
  // Bytes in one string field of a control message.
  uint64 control_string_bytes = 8;
  // Values in one frame, nested values and the items of list views included.
  uint64 batch_values = 9;
  // Bytes in one schema message.
  uint64 schema_bytes = 10;
  // Bytes the dictionaries one read or write holds at once take, where less than a frame's: at
  // least 262144, and never left 0.
  uint64 dictionary_bytes = 11;
  // Bytes in one catalog: a discovery's answer.
  uint64 catalog_bytes = 12;
  // Bytes one message that carries state or a stream's positions holds decoded, as the scan of
  // its encoding counts it, and so may take on the wire: an open's answer, a plan and its
  // request, a commit's request and a report of committed positions.
  uint64 state_bytes = 13;
  // Bytes in any other control message.
  uint64 control_message_bytes = 14;
}

// Opens the conversation.
message HandshakeRequest {
  // The protocol's major version; it must match.
  uint32 protocol_major = 1;
  // The optional features the host can use.
  repeated string features = 2;
  // The role the host wants.
  Role role = 3;
  // The limits the host enforces.
  Limits limits = 4;
}

// Who the connector is and what it can do.
message ConnectorSpec {
  // Its id.
  string id = 1;
  // Its version.
  string version = 2;
  // The roles it serves.
  repeated Role roles = 3;
  // The JSON Schema its configuration must satisfy.
  string config_schema_json = 4;
  // What it can store, once configured as a destination.
  optional Capabilities destination_capabilities = 5;
}

// The connector's answer to a handshake.
message HandshakeResponse {
  // The connector's spec, without the capabilities its configuration decides.
  ConnectorSpec spec = 1;
  // The features, of those offered, it will use.
  repeated string accepted_features = 2;
  // The limits the connector enforces on what it receives.
  Limits limits = 3;
  // The protocol's major version the connector speaks; the host refuses another.
  uint32 protocol_major = 4;
}

// Configures the connector.
message ConfigureRequest {
  // The connector's configuration, as JSON.
  string config_json = 1;
}

// The connector's answer to its configuration.
message ConfigureResponse {
  // The connector's spec, with the capabilities of the role it was configured for.
  ConnectorSpec spec = 1;
}

// Asks the connector to verify connectivity and permissions.
message CheckRequest {}

// The answer to a check.
message CheckResponse {}

// Asks a source for its catalog.
message DiscoverRequest {}

// A heartbeat.
message Ping {
  // Its sequence number.
  uint64 seq = 1;
}

// The answer to a heartbeat.
message Pong {
  // The sequence number of the ping it answers.
  uint64 seq = 1;
}
