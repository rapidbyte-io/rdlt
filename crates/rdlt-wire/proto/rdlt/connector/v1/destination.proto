// A destination's operations: opening a session, applying schema changes, writing, committing.
syntax = "proto3";

package rdlt.connector.v1;

import "rdlt/connector/v1/errors.proto";
import "rdlt/connector/v1/state.proto";
import "rdlt/connector/v1/types.proto";
import "rdlt/connector/v1/source.proto";

// Opens a session: fences older ones, discards unpublished staging and returns state.
message OpenRequest {
  // The pipeline.
  string pipeline = 1;
}

// An open session.
message OpenResponse {
  // The session's handle, which later requests name.
  uint64 session = 1;
  // The epoch the open set.
  uint64 epoch = 2;
  // The receipt of the pipeline's last commit that landed; absent before the first.
  optional Receipt landed = 3;
  // Every committed state record of the pipeline, with distinct keys.
  repeated StateRecord state = 4;
}

// The key rows of a merged table are matched by.
message MergeKey {
  // The key's columns.
  repeated string columns = 1;
  // The column ordering versions of one key.
  string seq = 2;
  // For a child table, the root table's key its rows follow.
  optional RootKey root = 3;
  // For a change stream's table, the columns saying what each row does.
  optional ChangeColumns changes = 4;
  // For a history table, the columns recording each version's life.
  optional HistoryColumns history = 5;
}

// The columns a history table records each version's life in.
message HistoryColumns {
  // When the version begins.
  string valid_from = 1;
  // When a later change closed it; null while current.
  string valid_to = 2;
  // Whether it is its key's current version.
  string is_current = 3;
  // The hash of its data columns.
  string row_hash = 4;
}

// The columns of a change stream's written rows that say what each row does.
message ChangeColumns {
  // The column holding each row's op code.
  string op = 1;
  // The column flagging an update's unchanged columns, where rows may flag some.
  optional string unchanged = 2;
  // For soft deletes, the column recording when a row was deleted; absent, deletes remove rows.
  optional string deleted_at = 3;
}

// How a child table's rows follow the root table's rows.
message RootKey {
  // The root table.
  string table = 1;
  // The column holding a row's root id.
  string id = 2;
  // The root row's sequence column.
  string seq = 3;
}

// A table a change or writer applies to.
message TableRef {
  // Its path.
  TablePath path = 1;
  // Its identifier in the destination.
  string name = 2;
  // Its schema version; at least 1.
  uint32 version = 3;
  // The hidden generation a replace fills, if it is one.
  optional uint64 generation = 4;
  // How its rows merge, if they do.
  optional MergeKey merge = 5;
}

// A change to a table's schema.
message TableChange {
  // The change.
  oneof change {
    // Creates the table.
    CreateTable create = 1;
    // Adds a nullable column.
    AddColumn add_column = 2;
    // Widens a column.
    WidenColumn widen = 3;
  }
}

// Creates a table.
message CreateTable {
  // The table.
  TableRef table = 1;
  // Its columns.
  TableSchema schema = 2;
}

// Adds a nullable column.
message AddColumn {
  // The table.
  TableRef table = 1;
  // The column.
  Field field = 2;
}

// Widens a column.
message WidenColumn {
  // The table.
  TableRef table = 1;
  // The column's identifier.
  string column = 2;
  // Its current type.
  LogicalType from = 3;
  // Its new type.
  LogicalType to = 4;
}

// Applies a schema change in a session.
message ApplySchemaRequest {
  // The session.
  uint64 session = 1;
  // The change.
  TableChange change = 2;
}

// The answer to a schema change.
message ApplySchemaResponse {}

// What the engine sends on a write.
message WriteFrame {
  // The frame.
  oneof frame {
    // Starts writing a table; the first message.
    WriteStart start = 1;
    // An Arrow schema, once per table version.
    WriteSchema schema = 2;
    // An Arrow record or dictionary batch.
    WriteBatch batch = 3;
    // Asks for everything written so far to be durable in staging.
    Unit flush = 4;
  }
}

// Starts writing a table.
message WriteStart {
  // The session.
  uint64 session = 1;
  // The table.
  TableRef table = 2;
}

// An Arrow schema for a table version: an IPC schema message.
message WriteSchema {
  // The table's schema version.
  uint32 version = 1;
  // The IPC schema message, as a flatbuffer.
  bytes ipc_schema = 2;
}

// An Arrow batch of one segment, in Arrow Flight's FlightData layout.
message WriteBatch {
  // The segment.
  uint64 segment = 1;
  // The IPC message: a record batch or dictionary batch flatbuffer.
  bytes data_header = 2;
  // Zero bytes placing data_body at a multiple of 64 bytes from the message's gRPC prefix, so
  // its receiver reads the body where it arrived.
  bytes padding = 3;
  // The message's body buffers.
  bytes data_body = 4;
}

// What a destination answers on a write.
message WriteAck {
  // The answer.
  oneof ack {
    // Grants bytes the engine may send.
    Credit credit = 1;
    // Everything written so far is durable in staging.
    WriteStats flushed = 2;
    // The write failed.
    Error error = 3;
  }
}

// What a writer staged.
message WriteStats {
  // Rows.
  uint64 rows = 1;
  // Bytes, as the destination measures them.
  uint64 bytes = 2;
}

// A range of segments, both ends included.
message SegmentRange {
  // The first segment.
  uint64 first = 1;
  // The last segment.
  uint64 last = 2;
}

// A generation a commit finishes: its table swaps to it.
message FinishGeneration {
  // The table.
  TablePath table = 1;
  // The generation.
  uint64 generation = 2;
}

// A child table whose rows a commit replaces for the root rows it merges.
message ChildTable {
  // The child table's identifier.
  string table = 1;
  // How its rows merge.
  MergeKey merge = 2;
}

// A commit's key: its session's epoch and its place among the session's commits.
message CommitKey {
  // The epoch of the session that makes the commit.
  uint64 epoch = 1;
  // The commit's place among its session's commits, from 1.
  uint64 seq = 2;
}

// What a commit publishes.
message CommitMeta {
  // The commit's key.
  CommitKey key = 1;
  // The key of the commit the session expects landed; absent where none of the pipeline has.
  optional CommitKey after = 2;
  // The segments it publishes, ascending, disjoint and not adjacent.
  repeated SegmentRange segments = 3;
  // The state changes it makes.
  repeated StateChange state_delta = 4;
  // The generations it finishes.
  repeated FinishGeneration finish_generations = 5;
  // The child tables it replaces rows of.
  repeated ChildTable child_tables = 6;
  // The tables it drops.
  repeated DroppedTable drop_tables = 7;
  // The segments of the attempt abandoned since its last commit, whose staged rows it removes;
  // ascending, disjoint, not adjacent, and none among `segments`.
  repeated SegmentRange abandoned = 8;
}

// A table a commit drops.
message DroppedTable {
  // Its path, as the pipeline's state names it.
  TablePath path = 1;
  // Its identifier in the destination.
  string name = 2;
}

// Commits in a session.
message CommitRequest {
  // The session.
  uint64 session = 1;
  // What to publish.
  CommitMeta meta = 2;
}

// What a commit published.
message Receipt {
  // The commit's key.
  CommitKey key = 1;
  // When it committed.
  Instant committed_at = 2;
  // Rows published.
  uint64 rows = 3;
  // Bytes published.
  uint64 bytes = 4;
}

// Closes a session.
message CloseRequest {
  // The session.
  uint64 session = 1;
}

// The answer to a close.
message CloseResponse {}

// Asks a destination for every row it published to a table.
message ReadPublishedRequest {
  // The table.
  TableRef table = 1;
}
