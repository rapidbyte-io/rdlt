[package]
name = "rdlt-connector-reference"
description = "Reference connectors for rdlt: in-memory, SQLite and file connectors, and a data generator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The destinations read back what they published, for certification: `ReadBack`, served only by
# a binary that names `readable_destination_factory`. The binaries here never do.
certify = ["rdlt-connector/certify"]
# The binaries of the test connectors, the generator and the memory connectors. They are no part
# of a deployment: their sizes and their store are whatever a host asks.
test-connectors = []

[[bin]]
name = "rdlt-connector-generator"
required-features = ["test-connectors"]

[[bin]]
name = "rdlt-connector-memory"
required-features = ["test-connectors"]

[dependencies]
arrow-array.workspace = true
arrow-cast.workspace = true
arrow-ipc.workspace = true
arrow-json.workspace = true
arrow-row.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
base64.workspace = true
bytes.workspace = true
flatbuffers.workspace = true
getrandom.workspace = true
parking_lot.workspace = true
rdlt-connector = { workspace = true, features = ["serve", "sqlgen"] }
rdlt-wire.workspace = true
rusqlite.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
xxhash-rust.workspace = true

[dev-dependencies]
arrow-buffer.workspace = true
proptest.workspace = true
# The crate's own tests serve the test connectors' binaries and read back what the destinations
# published: they turn both features on, whatever the command line asks for.
rdlt-connector-reference = { workspace = true, features = ["certify", "test-connectors"] }
rdlt-testkit.workspace = true
rdlt-connector = { workspace = true, features = ["serve", "sqlgen", "testing"] }
rdlt-host.workspace = true
rdlt-wire.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
