[package]
name = "rdlt-connector-reference"
description = "rdlt reference connector: the contract's own connector — one JSONL file in, JSONL parts and commit receipts out"
keywords = ["elt", "jsonl", "reference"]
categories = ["database", "encoding"]
documentation = "https://docs.rs/rdlt-connector-reference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The connector as a process: the protocol-server binary. OFF by
# default with `required-features` on the [[bin]], so a library consumer
# of this crate never pulls tonic or clap into its dependency tree.
bin-serve = ["rdlt-connector-sdk/serve", "dep:clap"]
# The spawn suite: the cells that spawn the REAL built binary. OFF by
# default so a plain workspace run never depends on a bin no workspace
# command builds; the Makefile enables it together with
# RDLT_BUILD_CONNECTOR_BINS=1, which lets the spawn helper build the bin
# before spawning (without it a missing bin fails loudly). The feature
# gates only the `#[cfg(feature = "spawn-bins")]` modules in
# `tests/cases/mod.rs`; their dev-deps stay unconditional because cargo
# has no optional dev-dependencies.
spawn-bins = []

# Behind `bin-serve` only, so `cargo build` at default features never
# discovers this target; the gate compiles it explicitly (Makefile
# `test:`) so it cannot rot unseen.
[[bin]]
name = "rdlt-connector-reference"
path = "src/bin/rdlt-connector-reference.rs"
required-features = ["bin-serve"]

[dependencies]
# The ONE rdlt dependency (the one-dependency rule): the SPI is reached
# through the sdk's `spi` re-export.
rdlt-connector-sdk = { workspace = true, features = ["schema"] }
# The server binary's argument surface alone (`--role`, the free
# `--version`); optional so the library surface never carries it.
clap = { workspace = true, optional = true }
# The jsonl part encoder: arrow's own line-delimited JSON writer renders
# the SPI's RecordBatch — the destination writes nothing else.
arrow = { workspace = true }
async-trait = { workspace = true }
# The cursor's rewrite-in-place guard (the tail hash of the consumed
# bytes) and the part name's tuple digest.
blake3 = { workspace = true }
# The session lease: an OS advisory lock beside the state slot, released
# automatically on process death so a crashed run never blocks recovery.
fs4 = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The certification cells: the certify library drives the built bin
# through both role suites against hermetic tempdir fixtures; the
# testkit supplies the in-process kits, fixtures and the spawn helper.
# Dev-dependencies never reach a consumer, so path-only workspace
# spellings are fine here.
rdlt-certify = { workspace = true }
rdlt-testkit = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
