[package]
name = "rdlt-connector"
description = "rdlt connector SPI: Source/Destination/LoadSession traits, RecordsOut, capabilities, error taxonomy"
keywords = ["elt", "connector", "spi", "arrow", "data"]
categories = ["database", "asynchronous"]
documentation = "https://docs.rs/rdlt-connector"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rdlt-core = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
object_store = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[features]
# Forwarded test infrastructure (crash sweep): connectors depend on the SPI
# only, so the fail-point feature routes through this seam to rdlt-core.
failpoints = ["rdlt-core/failpoints"]
# Opt-in `schemars::JsonSchema` for `Secret`, so the SPI carries no mandatory
# schemars dependency; connectors that generate config schemas enable it.
schema = ["dep:schemars"]
# Opt-in object-store vocabulary (the one recoverability rule), for the
# connectors that reach an object store; the SPI carries no mandatory
# dependency on it.
object-store = ["dep:object_store"]
