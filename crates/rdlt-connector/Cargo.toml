[package]
name = "rdlt-connector"
description = "The rdlt connector contract: vocabulary, traits and the connector SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["macros"]
macros = ["dep:rdlt-connector-macros"]
# Certification's probes: a destination reading back what it published, a source telling where it
# stands, each a factory of its own and a call of the protocol. A connector's own binary leaves
# them out.
certify = []
testing = ["dep:arrow-cast", "certify"]
wire = ["dep:rdlt-wire"]
serve = [
  "wire",
  "dep:http",
  "dep:hyper",
  "dep:hyper-util",
  "dep:tokio-stream",
  "dep:tower",
  "rdlt-wire/serve",
  "rdlt-wire/tls",
  "dep:tokio-rustls",
  "tokio/io-std",
  "tokio/io-util",
  "tokio/net",
  "tokio/rt-multi-thread",
  "tokio/signal",
  "dep:nix",
  "dep:rdlt-adopt",
]
sqlgen = ["dep:sha2"]

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast = { workspace = true, optional = true }
arrow-data.workspace = true
arrow-schema.workspace = true
base64.workspace = true
bytes.workspace = true
rdlt-connector-macros = { workspace = true, optional = true }
rdlt-wire = { workspace = true, optional = true }
http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["http2", "server"] }
hyper-util = { workspace = true, optional = true, features = ["tokio", "service"] }
tokio-stream = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["util"] }
tokio-rustls = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2 = { workspace = true, optional = true }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true, features = ["process", "resource", "signal"] }
rdlt-adopt = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
regex.workspace = true
prost.workspace = true
rusqlite.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
