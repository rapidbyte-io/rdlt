[package]
name = "rdlt-connector"
description = "The rdlt connector contract: vocabulary, traits and the connector SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["macros"]
macros = ["dep:rdlt-connector-macros"]
# Certification's probes: a destination reading back what it published, a source telling where it
# stands, each a factory of its own and a call of the protocol. A connector's own binary leaves
# them out.
certify = []
testing = ["dep:arrow-cast", "dep:regex-syntax", "dep:unicase", "certify"]
# Property-test strategies that draw logical types, for the property tests of crates built on the
# contract.
strategy = ["dep:proptest"]
wire = []
serve = [
  "wire",
  "dep:http",
  "dep:hyper",
  "dep:hyper-util",
  "dep:tokio-stream",
  "dep:tower",
  "rdlt-wire/serve",
  "rdlt-wire/tls",
  "dep:tokio-rustls",
  "tokio/io-std",
  "tokio/io-util",
  "tokio/net",
  "tokio/rt-multi-thread",
  "tokio/signal",
  "dep:nix",
  "dep:rdlt-adopt",
]
sqlgen = ["dep:sha2"]
# The Arrow merge of a merge table's rows, for a destination that keeps its rows as Arrow.
merge = ["dep:arrow-cast", "dep:arrow-row", "dep:arrow-select"]

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast = { workspace = true, optional = true }
arrow-row = { workspace = true, optional = true }
arrow-schema.workspace = true
arrow-select = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
parking_lot.workspace = true
proptest = { workspace = true, optional = true }
rdlt-connector-macros = { workspace = true, optional = true }
rdlt-wire.workspace = true
regex-syntax = { workspace = true, optional = true }
http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["http2", "server"] }
hyper-util = { workspace = true, optional = true, features = ["tokio", "service"] }
tokio-stream = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["util"] }
tokio-rustls = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_path_to_error.workspace = true
sha2 = { workspace = true, optional = true }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
unicase = { workspace = true, optional = true }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true, features = ["process", "resource", "signal"] }
rdlt-adopt = { workspace = true, optional = true }

[dev-dependencies]
http-body.workspace = true
hyper = { workspace = true, features = ["client", "http2"] }
proptest.workspace = true
rdlt-testkit.workspace = true
regex.workspace = true
prost.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
