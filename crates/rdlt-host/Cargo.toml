[package]
name = "rdlt-host"
description = "Hosting rdlt connectors out of process: the engine's source and destination over the wire protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A connector's process played by a script in this process, for the simulation; not a public API.
sim = []

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
base64.workspace = true
command-fds.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
rustix = { workspace = true, features = ["fs", "process"] }
rdlt-adopt.workspace = true
rdlt-connector = { workspace = true, features = ["wire"] }
rdlt-wire = { workspace = true, features = ["tls"] }
rustls.workspace = true
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic = { workspace = true, features = ["channel", "codegen"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
bytes.workspace = true
criterion.workspace = true
http.workspace = true
http-body.workspace = true
hyper = { workspace = true, features = ["client", "http2", "server"] }
hyper-util = { workspace = true, features = ["service", "tokio"] }
nix = { workspace = true, features = ["process", "resource", "sched", "signal", "time"] }
parking_lot.workspace = true
peak_alloc.workspace = true
proptest.workspace = true
rdlt-connector = { workspace = true, features = ["certify", "serve"] }
rdlt-connector-reference = { workspace = true, features = ["certify"] }
rdlt-engine = { workspace = true, features = ["bench"] }
rdlt-testkit = { workspace = true, features = ["fake"] }
rdlt-wire = { workspace = true, features = ["serve"] }
schemars.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
  "io-std",
  "process",
  "rt-multi-thread",
  "signal",
  "test-util",
] }
tonic = { workspace = true, features = ["server"] }

[lints]
workspace = true

# Beside the integration tests, whose served connectors it takes.
[[bench]]
name = "served"
path = "tests/it/bench.rs"
harness = false

# Beside the served bench, whose binary's entry as a connector it shares.
[[bench]]
name = "latency"
path = "tests/it/bench/latency.rs"
harness = false
