[package]
name = "rdlt-sim"
description = "Deterministic simulation harness for the rdlt engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alloc_tracker.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
parking_lot.workspace = true
rdlt-connector = { workspace = true, features = ["serve", "merge"] }
rdlt-engine = { workspace = true, features = ["sim"] }
rdlt-host = { workspace = true, features = ["sim"] }
rdlt-testkit = { workspace = true, features = ["fake"] }
rdlt-wire = { workspace = true, features = ["tls"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true
turmoil.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[dev-dependencies]
rdlt-connector = { workspace = true, features = ["serve", "merge", "testing"] }

[lints]
workspace = true
