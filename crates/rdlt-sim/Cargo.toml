[package]
name = "rdlt-sim"
description = "Deterministic simulation harness for the rdlt engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-schema.workspace = true
bytes.workspace = true
parking_lot.workspace = true
rdlt-connector = { workspace = true, features = ["serve"] }
rdlt-engine.workspace = true
rdlt-host.workspace = true
rdlt-testkit.workspace = true
rdlt-wire = { workspace = true, features = ["tls"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
turmoil.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[dev-dependencies]
rdlt-connector = { workspace = true, features = ["serve", "testing"] }

[lints]
workspace = true
