[package]
name = "rdlt-cli"
description = "rdlt CLI: run a YAML pipeline spec, stream events, report the outcome"
keywords = ["elt", "etl", "pipeline", "cli", "data"]
categories = ["command-line-utilities", "database"]
documentation = "https://docs.rs/rdlt-cli"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rdlt"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
# postgres implies postgres-source; parquet implies file (see crates/rdlt features).
rdlt = { workspace = true, features = ["rest", "duckdb", "postgres", "parquet", "iceberg", "snowflake"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
serde_yaml = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
