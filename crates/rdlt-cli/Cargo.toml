[package]
name = "rdlt-cli"
description = "The rdlt command line: write, check, run, inspect and certify pipelines and connectors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rdlt"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
console.workspace = true
indicatif.workspace = true
rdlt = { workspace = true, features = ["local", "remote", "sql", "otel"] }
rdlt-certify.workspace = true
rdlt-connector = { workspace = true, features = ["wire"] }
rdlt-host.workspace = true
rdlt-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-stream.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
insta.workspace = true
nix = { workspace = true, features = ["fs", "signal", "term"] }
parking_lot.workspace = true
rdlt-connector = { workspace = true, features = ["certify", "serve", "testing"] }
rdlt-connector-reference = { workspace = true, features = ["certify", "test-connectors"] }
regex.workspace = true
rdlt-testkit.workspace = true
rusqlite.workspace = true
schemars.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "process", "test-util"] }
vt100.workspace = true

[lints]
workspace = true

# The certifier's connector binaries, built here too so the CLI's tests can place them.
[[example]]
name = "serve_reference"
path = "../rdlt-certify/examples/serve_reference.rs"

[[example]]
name = "serve_source"
path = "../rdlt-certify/examples/serve_source.rs"

[[example]]
name = "serve_hang"
path = "../rdlt-certify/examples/serve_hang.rs"

[[example]]
name = "serve_log"
path = "../rdlt-engine/examples/serve_log.rs"

# The connector scaffold, compiled as written and certified: a crate of its own, not the CLI's.
[[test]]
name = "template"
path = "templates/rust/src/lib.rs"
