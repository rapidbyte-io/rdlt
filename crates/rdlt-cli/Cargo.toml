[package]
name = "rdlt-cli"
description = "The rdlt command line: write, check, run, inspect and certify pipelines and connectors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rdlt"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
rdlt = { workspace = true, features = ["local", "remote", "sql", "otel"] }
rdlt-connector.workspace = true
rdlt-host.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
] }
tracing-subscriber.workspace = true

[dev-dependencies]
insta.workspace = true
rdlt-connector = { workspace = true, features = ["certify", "serve", "testing"] }
rdlt-connector-reference = { workspace = true, features = ["certify", "test-connectors"] }
rdlt-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }

[lints]
workspace = true

# The certifier's connector binaries, built here too so the CLI's tests can place them.
[[example]]
name = "serve_reference"
path = "../rdlt-certify/examples/serve_reference.rs"

[[example]]
name = "serve_source"
path = "../rdlt-certify/examples/serve_source.rs"
