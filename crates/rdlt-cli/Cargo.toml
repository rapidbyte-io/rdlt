[package]
name = "rdlt-cli"
description = "rdlt dev CLI: TOML pipeline spec -> run -> report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rdlt"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
# postgres implies postgres-source; parquet implies file (see crates/rdlt features).
rdlt = { workspace = true, features = ["rest", "duckdb", "postgres", "parquet", "iceberg"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
serde_yaml = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
