[package]
name = "rdlt"
description = "rdlt facade: Pipeline builder over spawned connectors"
keywords = ["elt", "etl", "pipeline", "arrow", "data"]
categories = ["database", "asynchronous"]
documentation = "https://docs.rs/rdlt"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The spawned-pipeline acceptance suite: tests that build a pipeline
# from rich spellings and run it over REAL connector binaries. OFF by
# default — a plain workspace run must not depend on bins no workspace
# command builds. The Makefile's spawn-bins line enables it AND sets
# RDLT_BUILD_CONNECTOR_BINS=1, the same discipline as rdlt-runtime's
# own spawn-bins suite.
spawn-bins = []

[dependencies]
rdlt-connector-sdk = { workspace = true }
rdlt-core = { workspace = true }
rdlt-engine = { workspace = true }
# The out-of-process connector seam, the ONLY seam: every
# pipeline-document arm resolves through a runtime Provider into a
# spawned binary; the facade holds the default local one, and spells
# the connector requirement at the client crate's own path. The wire
# contract those crates carry is FROZEN, but they remain unpublished
# pending the separate publish wave — and rdlt itself cannot publish
# until they do.
rdlt-connector-client = { workspace = true }
rdlt-runtime = { workspace = true }
# tokio-util only: `cancellation_token()` hands one out. tokio itself is a
# DEV dependency — the facade's own source never names it, and a library that
# pulls in a runtime it does not use forces that cost on every consumer.
tokio-util = { workspace = true }
# The pipeline document model: serde derive + serde_yaml_ng's singleton_map
# with-module, and serde_json for the opaque connector config documents.
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rdlt-testkit = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
