[package]
name = "rdlt"
description = "Load data from sources into destinations exactly once: pipelines described in code or in a document, placed as their host's operator allows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["local"]
# Connectors spawned as local processes, in the sandbox unless the host trusts their binaries.
local = []
# Connectors reached over mutual TLS.
remote = []
# SQL transforms, planned by rdlt-sql.
sql = ["dep:rdlt-sql"]
# Export of traces and metrics over OTLP, set by the OTEL_* variables.
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
  "dep:tracing-subscriber",
  "dep:metrics-exporter-opentelemetry",
]

[dependencies]
arrow.workspace = true
metrics.workspace = true
metrics-exporter-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
rdlt-connector.workspace = true
rdlt-engine.workspace = true
rdlt-host.workspace = true
rdlt-sql = { workspace = true, optional = true }
rustix = { workspace = true, features = ["fs"] }
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
strsim.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
wildmatch.workspace = true

[dev-dependencies]
insta.workspace = true
jsonschema.workspace = true
metrics-util.workspace = true
parking_lot.workspace = true
proptest.workspace = true
rdlt-connector-reference.workspace = true
rdlt-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
