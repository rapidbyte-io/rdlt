[package]
name = "rdlt"
description = "rdlt facade: Pipeline builder, prelude, connector features"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
rest = ["dep:rdlt-source-rest"]
duckdb = ["dep:rdlt-dest-duckdb"]
postgres = ["dep:rdlt-postgres", "rdlt-postgres/dest"]
file = ["dep:rdlt-source-file"]
postgres-source = ["dep:rdlt-postgres", "rdlt-postgres/source"]
parquet = ["dep:rdlt-dest-parquet"]

[dependencies]
rdlt-core = { workspace = true }
rdlt-connector = { workspace = true }
rdlt-engine = { workspace = true }
rdlt-source-rest = { workspace = true, optional = true }
rdlt-dest-duckdb = { workspace = true, optional = true }
rdlt-source-file = { workspace = true, optional = true }
rdlt-postgres = { workspace = true, optional = true }
rdlt-dest-parquet = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
rdlt-testkit = { workspace = true }
rdlt-connector = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
