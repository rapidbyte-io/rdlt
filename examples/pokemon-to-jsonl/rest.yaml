# The PokéAPI — a public, unauthenticated REST API, which is why this
# example runs with no setup at all.
base_url: https://pokeapi.co/api/v2

# `none` is the default and is spelled out here because an example
# should show where credentials WOULD go. Anything secret belongs
# under `auth:`, never in `headers:`/`params:` — only `auth:` values
# are Secret-wrapped and masked in logs.
auth: none

# Be a good citizen of someone else's free API: one request at a time,
# with a floor between sends. Neither is required; both are here
# because an example is also a template.
max_concurrency: 1
min_request_interval_ms: 200

streams:
  - name: pokemon
    path: /pokemon

    # PokéAPI answers {count, next, previous, results:[...]} — the rows
    # are under `results`, not at the top level.
    records_path: results

    # It hands back a fully-formed `next` URL, so follow that rather
    # than doing arithmetic on offset/limit. When an API gives you the
    # next link, using it is both simpler and less likely to be wrong.
    pagination:
      type: next_url
      next_url_path: next

    params:
      limit: "100"

    # Each row is {name, url}; `name` is unique and stable, which makes
    # re-runs idempotent instead of appending duplicates.
    primary_key: [name]
