# Pokémon REST API -> newline-delimited JSON on the local filesystem.
#
#   rdlt run examples/pokemon-to-jsonl/pipeline.yaml
#
# Needs nothing but a network connection. See examples/README.md.
pipeline: pokemon-to-jsonl

# rdlt's write-ahead log lives here. It is what makes a crashed run
# resumable rather than half-applied, so it belongs on real disk you
# are willing to keep between runs.
workdir: examples/pokemon-to-jsonl/.rdlt

# `replace` rewrites the table each run — the right choice for a small
# reference dataset you want to mirror. Use `append` to accumulate, or
# `merge` to upsert on the declared primary key.
write_mode: replace

# How much the engine accumulates before each destination write —
# and so how many rows land in each output file. Destination-agnostic:
# the engine does the accumulating, so this means the same to a file,
# a table or a warehouse. Without it, each source page (100 rows here)
# becomes its own part.
batch_policy:
  # every_rows: 1000
  every_bytes: 100000

source:
  # The source document, written INLINE. Every connector also accepts
  # `config: <path>` instead, which is the better choice once a
  # document is shared between pipelines or holds a credential you
  # want to keep out of this file.
  rest:
    base_url: https://pokeapi.co/api/v2

    # `none` is spelled out to show where credentials WOULD go.
    # Anything secret belongs under `auth:`, never in `headers:` or
    # `params:` — only `auth:` values are Secret-wrapped and masked.
    auth: none

    # Be a good citizen of someone else's free API: one request at a
    # time, with a floor between sends.
    max_concurrency: 1
    min_request_interval_ms: 200

    streams:
      - name: pokemon
        path: /pokemon

        # PokéAPI answers {count, next, previous, results:[...]} — the
        # rows are under `results`, not at the top level.
        records_path: results

        # It hands back a fully-formed `next` URL, so follow that
        # rather than doing arithmetic on offset/limit. When an API
        # gives you the next link, using it is both simpler and less
        # likely to be wrong.
        pagination:
          type: next_url
          next_url_path: next

        params:
          limit: "100"

        # Each row is {name, url}; `name` is unique and stable, which
        # makes re-runs idempotent instead of appending duplicates.
        primary_key: [name]

destination:
  file:
    path: examples/pokemon-to-jsonl/out
    format: jsonl
