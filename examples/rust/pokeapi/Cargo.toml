[package]
name = "pokeapi"
description = "A PokeAPI source connector, run in process, served as its own binary and certified"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "pokeapi"

[dependencies]
rdlt.workspace = true
rdlt-connector = { workspace = true, features = ["serve"] }
rdlt-connector-reference.workspace = true
httpdate.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
rdlt-connector = { workspace = true, features = ["testing"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
