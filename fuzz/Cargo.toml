[package]
name = "rdlt-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arrow-array = "59.2"
arrow-schema = "59.2"
bytes = "1.12.1"
crc32c = "0.6"
http-body = "1.1.0"
libfuzzer-sys = "0.4.13"
peak_alloc = "0.3.0"
rdlt-connector = { path = "../crates/rdlt-connector", default-features = false, features = [
  "wire",
] }
rdlt-engine = { path = "../crates/rdlt-engine", features = ["bench"] }
rdlt-wire = { path = "../crates/rdlt-wire" }

[[bin]]
name = "state_record"
path = "fuzz_targets/state_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred"
path = "fuzz_targets/shred.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_messages"
path = "fuzz_targets/wire_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_log"
path = "fuzz_targets/wal_log.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_plane"
path = "fuzz_targets/wire_plane.rs"
test = false
doc = false
bench = false
