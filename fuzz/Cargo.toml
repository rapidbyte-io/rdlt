[package]
name = "rdlt-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
# SQL transforms, which only the targets that plan or run SQL build, as DataFusion takes long to.
sql = ["dep:rdlt-sql"]

[dependencies]
arrow-array = "59.2"
arrow-schema = "59.2"
arrow-select = "59.2"
bytes = "1.12.1"
http-body = "1.1.0"
libfuzzer-sys = "0.4.13"
peak_alloc = "0.3.0"
proptest = "1.11.0"
rdlt = { path = "../crates/rdlt", default-features = false }
rdlt-connector = { path = "../crates/rdlt-connector", default-features = false, features = [
  "wire",
] }
rdlt-engine = { path = "../crates/rdlt-engine", features = ["bench"] }
rdlt-sql = { path = "../crates/rdlt-sql", features = ["bench"], optional = true }
rdlt-testkit = { path = "../crates/rdlt-testkit" }
rdlt-wire = { path = "../crates/rdlt-wire" }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }

[[bin]]
name = "state_record"
path = "fuzz_targets/state_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred"
path = "fuzz_targets/shred.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_messages"
path = "fuzz_targets/wire_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_plane"
path = "fuzz_targets/wire_plane.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sql_plan"
path = "fuzz_targets/sql_plan.rs"
test = false
doc = false
bench = false
required-features = ["sql"]

[[bin]]
name = "transform_apply"
path = "fuzz_targets/transform_apply.rs"
test = false
doc = false
bench = false
required-features = ["sql"]

[[bin]]
name = "document"
path = "fuzz_targets/document.rs"
test = false
doc = false
bench = false
