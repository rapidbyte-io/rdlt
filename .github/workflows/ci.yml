name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests
        run: cargo nextest run --workspace
      - name: Doc-tests
        run: cargo test --doc --workspace

  semver:
    # Seam crates are SEMVER-SACRED (plan.md): every PR is checked against the
    # merge-base on main — a real, BLOCKING gate (no continue-on-error escape hatch;
    # review finding #9). The only skip is structural: main not carrying the crates
    # yet (the bootstrap PR), detected explicitly rather than by swallowing failures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: semver-checks (rdlt-core, rdlt-connector) vs main
        run: |
          if git ls-tree --name-only origin/main | grep -qx crates; then
            cargo semver-checks check-release \
              --baseline-rev origin/main \
              -p rdlt-core -p rdlt-connector
          else
            echo "origin/main has no crates yet (bootstrap PR) — nothing to compare"
          fi
