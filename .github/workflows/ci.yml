name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only READS the repo (builds, tests,
# a read-only semver diff against main). A compromised action ref
# cannot push, open PRs, or touch releases with a read-only token. A
# job that ever needs more raises it in its own `permissions:` block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Disk-constraint mitigation; rationale in .github/actions/free-disk/action.yml.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Actions are SHA-PINNED, not tag-pinned: a mutable tag (`@v4`,
# `@nightly`) lets a compromised or rewritten ref run arbitrary code
# with the runner's token. The trailing `# vX` comment records the tag
# the SHA was resolved from (2026-08-14) so a bump is a deliberate,
# reviewable SHA change. Resolved:
#   actions/checkout        v4 -> 11d5960a326750d5838078e36cf38b85af677262
#   Swatinem/rust-cache     v2 -> 6323deb102c322ba6fcbdcafc7e3dddab59af2b6
#   taiki-e/install-action  v2 -> 82cd3e7658a6f96c86c0234aeeda1748937cb0a1
#   dtolnay/rust-toolchain  nightly -> 7c8d7d138f5c09cef361f8214cf96882cd029cdb
#   actions/upload-artifact v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Disk-constraint mitigation — see .github/actions/free-disk/action.yml.
      - uses: ./.github/actions/free-disk
      # Toolchain (1.96.0 + rustfmt/clippy) governed by rust-toolchain.toml;
      # rustup auto-installs it with its components on first cargo invocation.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Lint (make lint)
        run: make lint
      # 5.12 (GLM round 7): the docs leg runs `-D warnings`, so a dead
      # intra-doc link fails it — but it previously ran only in
      # `make check` (deep-checks), letting exactly that class sit green
      # in PR CI. One rustdoc pass is cheap next to the lint leg it
      # shares a cache with.
      - name: Docs (make docs)
        run: make docs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Disk-constraint mitigation — see .github/actions/free-disk/action.yml.
      - uses: ./.github/actions/free-disk
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-nextest
      - name: Tests (make test)
        run: make test
      - name: Crash sweep (make test TARGET=sweep)
        run: make test TARGET=sweep

  fuzz-smoke:
    # A SHORT fuzz leg on every PR (L12): the deep tier fuzzes nightly,
    # so a change breaking a fuzz invariant was otherwise caught at best
    # the next night. A small `-runs` count per target — libFuzzer
    # replays the seed corpus first, so even a seed-triggered regression
    # surfaces here. Same Makefile verb the nightly runs, different bound.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Disk-constraint mitigation — see .github/actions/free-disk/action.yml.
      - uses: ./.github/actions/free-disk
      # cargo-fuzz needs nightly, so nightly is the one toolchain here.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz smoke (short -runs per target)
        run: FUZZ_RUN_BOUND=-runs=100000 make test TARGET=fuzz
      - name: Upload fuzz artifacts on findings
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/

  perf-gate:
    # Instruction-count regression gate (feature 003, G1): deterministic on
    # shared runners; >3% vs benches/perf-baselines.json blocks like semver.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Disk-constraint mitigation — see .github/actions/free-disk/action.yml.
      - uses: ./.github/actions/free-disk
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify iai-callgrind lib/runner version agreement
        run: |
          # The iai-callgrind LIBRARY and its RUNNER must match exactly, or the
          # instruction counts silently skew. The lib is pinned in
          # [workspace.dependencies] (Cargo.toml: iai-callgrind = "=X.Y.Z"); the
          # runner version is the literal below and on the install step's
          # --version flag. Bumping one without the others fails here, loudly.
          RUNNER_VERSION=0.16.1
          LIB_VERSION="$(sed -n 's/^iai-callgrind = "=\([0-9][0-9.]*\)"/\1/p' Cargo.toml)"
          if [ -z "$LIB_VERSION" ]; then
            echo "::error::could not parse iai-callgrind pin from Cargo.toml [workspace.dependencies]"
            exit 1
          fi
          if [ "$LIB_VERSION" != "$RUNNER_VERSION" ]; then
            echo "::error::iai-callgrind lib pin ($LIB_VERSION) != runner ($RUNNER_VERSION) — bump both together"
            exit 1
          fi
          echo "iai-callgrind lib and runner agree at $LIB_VERSION"
      - name: Install valgrind + iai runner
        run: |
          sudo apt-get update && sudo apt-get install -y valgrind
          # Runner version kept in lockstep with the iai-callgrind lib pin in
          # Cargo.toml [workspace.dependencies]; the step above enforces it.
          cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Perf gate (make bench TARGET=iai)
        run: make bench TARGET=iai
      # The release profile is still exercised here, but the cold-start check
      # is NOT: it is a wall-clock measurement needing hyperfine and a quiet
      # machine. It runs in `make check` locally and in recorded sessions.
      - name: Release build (profile smoke)
        run: make release

  semver:
    # Seam crates are SEMVER-SACRED (plan.md): every PR is checked against the
    # merge-base on main — a real, BLOCKING gate (no continue-on-error escape hatch;
    # review finding #9). The only skip is structural: main not carrying the crates
    # yet (the bootstrap PR), detected explicitly rather than by swallowing failures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Disk-constraint mitigation — see .github/actions/free-disk/action.yml.
      # semver-checks builds two full workspace trees (baseline + current).
      - uses: ./.github/actions/free-disk
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-semver-checks
      - name: semver-checks (whole workspace) vs main
        run: |
          if git ls-tree --name-only origin/main | grep -qx crates; then
            cargo semver-checks check-release \
              --baseline-rev origin/main \
              --workspace
          else
            echo "origin/main has no crates yet (bootstrap PR) — nothing to compare"
          fi
