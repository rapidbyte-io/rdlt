[files]
# proptest's saved cases, whose comments hold drawn text, and the facade's public API, as
# rustdoc names its dependencies' paths.
extend-exclude = ["target/", "proptest-regressions/", "crates/rdlt/public-api.txt"]

[default.extend-identifiers]
# The open flag O_WRONLY, as rustix names it.
WRONLY = "WRONLY"
# pydantic-core's serializer schema, as it names it.
plain_serializer_function_ser_schema = "plain_serializer_function_ser_schema"

[default.extend-words]
# Keys and words misspelled on purpose, in the tests of a document's errors.
apend = "apend"
conectors = "conectors"
replce = "replce"
retyr = "retyr"
wrte = "wrte"
