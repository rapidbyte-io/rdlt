[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/rapidbyte-io/rdlt"

[workspace.dependencies]
# Workspace crates
rdlt = { path = "crates/rdlt", version = "0.0.0" }                                         # the facade, which the Python extension binds and the CLI is the binary of
rdlt-adopt = { path = "crates/rdlt-adopt", version = "0.0.0" }                             # the audited unsafe code: adopting a host's socket, and a child's inherited descriptors
rdlt-certify = { path = "crates/rdlt-certify", version = "0.0.0" }                         # certification as a library, whose T clauses rdlt-sql's tests run
rdlt-connector = { path = "crates/rdlt-connector", version = "0.0.0" }                     # the connector contract
rdlt-connector-macros = { path = "crates/rdlt-connector-macros", version = "0.0.0" }       # #[source] and #[destination]
rdlt-connector-reference = { path = "crates/rdlt-connector-reference", version = "0.0.0" } # reference connectors
rdlt-engine = { path = "crates/rdlt-engine", version = "0.0.0" }                           # the engine, for rdlt-sim
rdlt-sql = { path = "crates/rdlt-sql", version = "0.0.0" }                                 # stateless SQL transforms, for embedders and rdlt-sim
rdlt-host = { path = "crates/rdlt-host", version = "0.0.0" }                               # connectors out of process
rdlt-testkit = { path = "crates/rdlt-testkit" }                                            # drawn data and the value model, for tests and rdlt-sim
rdlt-wire = { path = "crates/rdlt-wire", version = "0.0.0" }                               # the wire protocol: messages, the Arrow codec and limits

# Libraries
arrow = { version = "59.3", default-features = false } # the facade's re-export of Arrow, so its users never chase the version
arrow-array = { version = "59.2", features = [
  "chrono-tz",
] } # record batches, with named time zones; one arrow major across the workspace, matching DataFusion
arrow-buffer = "59.2" # null and offset buffers the shredder builds columns from
arrow-cast = "59.2" # exact casts into a table's column types, and text renderings for lowering
arrow-data = "59.2" # the buffers behind an array, for which rows Arrow's writer writes a union from
arrow-ipc = "59.2" # Arrow IPC, for the wire's batches, the files connectors and the bench sink
arrow-json = "59.2" # JSON renderings of values stored as Json, and JSON lines files
arrow-pyarrow = "59.3.2" # Arrow batches and schemas to and from Python through the C Data Interface and its capsules, with no copy
arrow-row = "59.2" # comparable row encodings of merge keys
arrow-schema = "59.2" # arrow data types and schemas
arrow-select = "59.2" # take, filter and concat for discards, compaction and merges
base64 = "0.22" # cursor bytes inside JSON state values
blake3 = "1.8.7" # row identity: the collision-resistant hash of each row's canonical encoding
bytes = { version = "1.12.1", features = [
  "serde",
] } # zero-copy byte buffers for pushes, cursors and state
chrono = { version = "0.4.45", default-features = false } # calendar dates and zone offsets for exact temporal conversions, the version arrow uses
datafusion-common = { version = "55.2.0", default-features = false, features = [
  "recursive_protection",
] } # DataFusion's schemas, scalars and options, for SQL transforms, its stack grown on deep ones; one arrow major with the workspace
datafusion-expr = { version = "55.2.0", default-features = false, features = [
  "recursive_protection",
] } # DataFusion's logical expressions and the context a SQL transform is planned in
datafusion-functions = { version = "55.2.0", default-features = false, features = [
  "datetime_expressions",
  "math_expressions",
  "regex_expressions",
  "string_expressions",
  "unicode_expressions",
] } # the scalar functions SQL transforms may call, of which they register a bounded few
datafusion-optimizer = { version = "55.2.0", default-features = false, features = [
  "recursive_protection",
] } # type coercion of a planned SQL transform, which the planner leaves undone
datafusion-physical-expr = { version = "55.2.0", default-features = false, features = [
  "recursive_protection",
] } # SQL transforms' expressions, evaluated batch by batch on the engine's pool
datafusion-sql = { version = "55.2.0", default-features = false, features = [
  "recursive_protection",
  "unicode_expressions",
] } # parsing and planning SQL transforms
proc-macro2 = "1.0.107" # token streams for rdlt-connector-macros
quote = "1.0.47" # code generation for rdlt-connector-macros
schemars = "1.2.2" # JSON Schema for connector configuration
serde = { version = "1.0.229", features = [
  "derive",
  "rc",
] } # serialization of state, specs and configuration
serde_json = { version = "1.0.151", features = [
  "float_roundtrip",
] } # JSON rows, cursors, state values and configuration, floats read back exactly
serde_path_to_error = "0.1.20" # field paths in configuration errors
serde-saphyr = { version = "2.1.1", default-features = false, features = [
  "deserialize",
  "serialize",
] } # a pipeline's document, YAML or JSON, read as hostile input under limits
strsim = "0.11.1" # the nearest known key to an unknown one in a document's errors
syn = { version = "2", features = ["full"] } # parsing impl blocks in rdlt-connector-macros
getrandom = "0.4.3" # the operating system random source behind SystemEnv, and the names of the reference connectors' temporary files
memchr = "2.8.3" # finding the lines of JSON pushes
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] } # joining the simulation's hostile and broken hosts' calls, and a request stream of one frame
command-fds = { version = "0.3.3", default-features = false } # a spawned connector's socket at file descriptor 3
rustix = { version = "1.1.5", default-features = false, features = [
  "std",
] } # a connector's exit seen before it is reaped and its process group signalled; files opened by name beneath an open directory, following no link, without `unsafe`
libc = { version = "0.2.189", default-features = false } # close_range and fcntl in a spawned child, for rdlt-adopt alone
nix = { version = "0.31.3", default-features = false } # a spawned connector ends with its host (PR_SET_PDEATHSIG), and the host signals its connectors
parking_lot = "0.12.5" # locks without poisoning
regex = "1.13.1" # xtask lint patterns, and the size limit SQL transforms' regular expressions compile under
prost = "0.14.4" # protocol buffer messages of the wire protocol
pyo3 = { version = "0.29.3", default-features = false, features = [
  "abi3-py311",
  "macros",
] } # rdlt._native: the Python extension's classes, functions and calls into the interpreter; abi3 for CPython 3.11 and later
pyo3-build-config = "0.29.3" # the interpreter rdlt-python links its tests against, for their run-time library path
pyo3-async-runtimes = { version = "0.29.0", default-features = false, features = [
  "tokio-runtime",
] } # awaitables for asyncio, completed on the event loop's thread, over rdlt._native's runtime
tonic = { version = "0.14.6", default-features = false } # gRPC: the wire protocol's service stubs, server and client
tonic-prost = "0.14.6" # the protobuf codec of the wire protocol's gRPC service
http = "1.5.0" # the requests a served connection's gRPC service takes
http-body = "1.1.0" # the bodies of calls, held to their messages' bounds before they are decoded
hyper = { version = "1.11.1", default-features = false } # one HTTP/2 connection served to its end
hyper-util = { version = "0.1.21", default-features = false } # tokio's executor, timers and IO for hyper
tokio-stream = { version = "0.1.19", default-features = false } # the streams a served read and write answer with
tower = { version = "0.5.3", default-features = false } # adapting the gRPC service and the client's connector
rayon = "1.12.0" # the compute pool for CPU-bound stages
ryu = "1.0.23" # the shortest text of a float, which row identity encodes exactly and the test kit compares
rustls = { version = "0.23.45", default-features = false, features = [
  "aws_lc_rs",
  "prefer-post-quantum",
  "std",
] } # TLS 1.3 for connectors reached over the network
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = [
  "std",
] } # the names a host's certificate carries, for a listening connector's allowlist
tokio-rustls = { version = "0.26.5", default-features = false, features = [
  "aws_lc_rs",
] } # rustls over tokio's sockets
semver = "1.0.28" # the versions a connector reference accepts
subtle = { version = "2.6.1", default-features = false } # secrets compared in constant time
zeroize = { version = "1.9.0", default-features = false, features = [
  "alloc",
] } # secrets and configurations wiped from memory when dropped
sha2 = { version = "0.10.9", default-features = false, features = [
  "std",
] } # the digest of a connector's binary, and of a tool's package lockfile
hmac = "0.12.1" # the keyed digest a mask hashes each value with, over sha2's
opentelemetry = { version = "0.33.1", default-features = false, features = [
  "trace",
  "metrics",
  "internal-logs",
] } # the facade's OTLP export: the API its spans and metrics go through
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = [
  "trace",
  "metrics",
  "internal-logs",
] } # the facade's OTLP export: providers, batching and readers
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "grpc-tonic",
  "trace",
  "metrics",
  "tls-aws-lc",
  "tls-roots",
  "internal-logs",
] } # the facade's OTLP export over gRPC, on the workspace's tonic and AWS-LC, verifying a collector against the system's roots, and logging a failed export
tracing-opentelemetry = { version = "0.34.0", default-features = false } # the facade's spans as OpenTelemetry spans
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "env-filter",
  "registry",
  "std",
  "ansi",
] } # the facade's and the CLI's subscriber: filtered by RUST_LOG, to stderr
metrics-exporter-opentelemetry = "0.2.2" # the facade's `metrics` recorded as OpenTelemetry metrics
metrics = "0.24.6" # the facade's counters, histograms and gauges of a run, for whichever recorder an embedder installs
metrics-util = { version = "0.20.4", default-features = false, features = [
  "debugging",
] } # tests read what the facade recorded
tracing-core = { version = "0.1.36", default-features = false, features = [
  "std",
] } # the span-recording subscriber's current span, which tracing does not re-export
tracing = { version = "0.1.44", default-features = false, features = [
  "std",
] } # a spawned connector's output, and the engine's spans
sonic-rs = "0.5.10" # SIMD JSON parsing and rendering for the shredder
sqlparser = { version = "0.62.0", default-features = false, features = [
  "recursive-protection",
  "std",
  "visitor",
] } # SQL transforms' parser, its stack grown on deep text, which DataFusion's SQL front end leaves off
stacker = "0.1.25" # stack grown on demand, so JSON at the nesting limit parses, and SQL at its depth limit plans, in every build
thiserror = "2.0.20" # typed error derives
tokio = { version = "1.53.3", default-features = false } # async runtime, timers and task sets
turmoil = { version = "0.7.2", default-features = false } # a simulated network of hosts on paused tokio clocks
tokio-util = { version = "0.7.19", default-features = false } # CancellationToken
xxhash-rust = { version = "0.8.18", features = [
  "xxh3",
] } # hashes that tell colliding identifiers apart
regex-syntax = { version = "0.8.11", default-features = false, features = [
  "std",
  "unicode-case",
] } # Unicode 16.0's simple case folding, which certification's identifier pairs follow
unicase = "2.9.0" # Unicode's full case folding, which certification's identifier pairs follow
wildmatch = "2.7.0" # a document's stream selection by `*` and `?` against the source's catalog

# Tooling and tests
anyhow = "1.0.104" # error reporting at xtask's command-line entry point
cargo_metadata = "0.23.1" # xtask reads the workspace graph for the dependency rule
clap = { version = "4.6.7", features = ["derive"] } # command-line parsing for xtask and the CLI
clap_complete = "4.6.11" # the CLI's shell completions
console = { version = "0.16.6", default-features = false, features = [
  "ansi-parsing",
  "std",
  "unicode-width",
] } # the width and colour of what the CLI shows at a terminal
fail = { version = "0.5.1", default-features = false } # crash points for the failpoint sweep
indicatif = { version = "0.18.6", default-features = false, features = [
  "unicode-width",
] } # the spinners and live region of the CLI at a terminal
flatbuffers = "25.2.10" # the verifier's depth for IPC headers and Arrow file footers, and hand-built messages in their tests
datafusion = { version = "55.2.0", default-features = false, features = [
  "datetime_expressions",
  "math_expressions",
  "regex_expressions",
  "sql",
  "string_expressions",
  "unicode_expressions",
] } # the full executor SQL transforms' per-batch evaluation is tested against
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
] } # throughput benchmarks
insta = { version = "1.48.0", default-features = false } # snapshots of the certification's help and reports, and of the engine's error report
jsonschema = { version = "0.60.2", default-features = false } # checks the document's JSON Schema against documents the facade's reader takes
alloc_tracker = { version = "0.7.13", default-features = false } # each thread's heap and its peak, for the simulation's check that runs hold what they reserve
peak_alloc = "0.3.0" # the heap's peak size, for the engine's memory bound
stats_alloc = "0.1.10" # counts of a benchmark's allocations and the bytes they request, which peak_alloc does not keep
proptest = "1.11.0" # property tests
rcgen = "0.14.10" # a certificate authority made at test time, for the protocol's TLS
vt100 = "0.18.1" # reads a pseudo-terminal's screen in the CLI's tests
tonic-prost-build = "0.14.6" # xtask generates the wire protocol's messages and service stubs
protox = "0.9.1" # xtask compiles the wire protocol's .proto files without protoc
public-api = "0.52.2" # xtask lists the facade's public API, from rustdoc's JSON, against its snapshot
rustdoc-json = "0.9.10" # xtask builds the facade's rustdoc JSON for its public-API snapshot
rusqlite = { version = "0.41.1", default-features = false, features = [
  "bundled",
  "cache",
  "limits",
] } # the reference SQL destination, and running sqlgen's statements in its tests
tempfile = "3.27.0" # temporary directories in tests
toml = "1.1.6" # xtask reads the tool lockfile
walkdir = "2.5.0" # xtask walks the source tree

[workspace.lints.rust]
# Every target's root forbids unsafe code, which nothing below it can lift, but rdlt-adopt's: the
# audited crate, which allows it where it needs it; `cargo xtask lint` checks both, and reports
# the keyword where the compiler does not look: in a macro's body.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
let_underscore_drop = "warn"
# Kani alone sets `kani`, in the builds that compile proofs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
dbg_macro = "warn"
todo = "warn"
unused_async_trait_impl = "allow"            # connectors implement async trait methods with `async fn`, awaiting or not

# Tests and debugging need file and line in backtraces, not full debug information: line tables
# alone link test binaries several times faster and keep target directories a fraction the size.
[profile.dev]
debug = "line-tables-only"

# A backtrace needs file and line in this workspace's frames, not in its dependencies': built
# without line tables, they leave every test binary less to link.
[profile.dev.package."*"]
debug = false

# A spawned connector's digest hashes its binary, which a debug build makes hundreds of megabytes;
# optimised, the tests that spawn connectors hash it in a fraction of a second, not seconds.
[profile.dev.package.sha2]
opt-level = 3

# SQLite's C is built optimised: the bench smoke run loads the SQLite bench's million rows through it.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# sqlparser is built optimised, as releases build it: a nested type is parsed a frame a level,
# and the stack SQL text is parsed on is sized for optimised frames; unoptimised, nested
# `TABLE(a ` takes 4 KiB of stack a byte of text, all the stack a text is given.
[profile.dev.package.sqlparser]
opt-level = 3

# Shipped binaries and benchmarks build alike, so a benchmark measures what ships: fat LTO and one
# codegen unit inline the shredder's and the lowering's hot loops across crates. Cargo applies only
# the root package's profiles, so an embedder sets the same in its own manifest.
[profile.release]
lto = "fat"
codegen-units = 1

# Profiling: release's code with line tables, so samples resolve to source lines; `just profiling`
# adds frame pointers.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# The simulation suite: optimised, since it replays thousands of seeds per run, with the overflow
# checks and debug assertions a simulation exists to trip, and without release's whole-program
# optimisation, which would slow every shard's build.
[profile.sim]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true

# Mutation testing: each mutant rebuilds and relinks the test binaries, which debug info only
# slows, and incremental builds keep each job's rebuild to the crate the mutant is in.
[profile.mutants]
inherits = "dev"
debug = false
incremental = true

# Dependencies optimised, as the mutated crates never are: built once a run, they keep Arrow,
# Serde and Tokio's work in tests that bound large inputs from taking seconds, which a mutant's
# tests beside another's on a four-core runner stretched past their limits.
[profile.mutants.package."*"]
opt-level = 2
