[workspace]
resolver = "3"
members = [
    "crates/rdlt-core",
    "crates/rdlt-connector",
    "crates/rdlt-connector-sdk",
    "crates/rdlt-engine",
    "crates/rdlt",
    "crates/rdlt-testkit",
    "crates/rdlt-connector-rest",
    "crates/rdlt-connector-duckdb",
    "crates/rdlt-connector-file",
    "crates/rdlt-connector-iceberg",
    "crates/rdlt-connector-oracle",
    "crates/rdlt-connector-postgres",
    "crates/rdlt-cli",
    "crates/rdlt-bench",
    "crates/rdlt-connector-sqlcore",
    "crates/rdlt-connector-snowflake",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
# MSRV floor. rust-toolchain.toml pins the exact build toolchain (1.96.0); this
# is the minimum the workspace commits to supporting, inherited by every crate.
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/rapidbyte-io/rdlt"

[workspace.dependencies]
fail = "0.5"
memchr = "2"
# Internal crates (path deps; version for future publishing).
# EXCEPTION while the Snowflake connector consumes a forked driver by git
# revision: rdlt, rdlt-cli and rdlt-connector-snowflake cannot be published
# until that dependency is retired. Recorded, with the exits, in
# tools/allowed-git-deps.toml.
rdlt-core = { path = "crates/rdlt-core", version = "0.3.0" }
rdlt-connector = { path = "crates/rdlt-connector", version = "0.3.0" }
rdlt-connector-sdk = { path = "crates/rdlt-connector-sdk", version = "0.3.0" }
rdlt-engine = { path = "crates/rdlt-engine", version = "0.3.0" }
rdlt = { path = "crates/rdlt", version = "0.3.0" }
rdlt-testkit = { path = "crates/rdlt-testkit", version = "0.3.0" }
rdlt-connector-rest = { path = "crates/rdlt-connector-rest", version = "0.3.0" }
rdlt-connector-duckdb = { path = "crates/rdlt-connector-duckdb", version = "0.3.0" }
rdlt-connector-snowflake = { path = "crates/rdlt-connector-snowflake", version = "0.3.0" }
rdlt-connector-file = { path = "crates/rdlt-connector-file", version = "0.3.0" }
rdlt-connector-iceberg = { path = "crates/rdlt-connector-iceberg", version = "0.3.0" }
rdlt-connector-oracle = { path = "crates/rdlt-connector-oracle", version = "0.3.0" }
rdlt-connector-postgres = { path = "crates/rdlt-connector-postgres", version = "0.3.0", default-features = false }
rdlt-connector-sqlcore = { path = "crates/rdlt-connector-sqlcore", version = "0.3.0" }

# arrow-rs: single workspace-wide major (research.md R10). Pinned to the major that
# duckdb-rs links — connectors receive `RecordBatch` through the rdlt-connector
# re-export, so version identity across the workspace is a correctness requirement,
# not a preference.
arrow = "58.3"
arrow-schema = "58.3"
arrow-array = "58.3"
arrow-select = "58.3"
arrow-cast = "58.3"
parquet = "58.3"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
bytes = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
glob = "0.3"
csv = "1.4"
flate2 = "1"
zstd = "0.13"
futures = "0.3"
tokio-util = "0.7"
fs4 = "0.13"
# CLI-only: the mallopt FFI (rdlt-cli) — the sole sanctioned unsafe in the tree.
libc = "0.2"

# Connectors
object_store = { version = "0.12", features = ["aws"] }
iceberg = "=0.10.0"
iceberg-catalog-rest = "=0.10.0"
iceberg-storage-opendal = { version = "=0.10.0", features = ["opendal-s3"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde_yaml = "0.9"
# Already in the tree via hyper (reqwest); a direct edge costs no new entry.
httpdate = "1"
duckdb = { version = "1", features = ["bundled", "appender-arrow"] }
# Snowflake session protocol. Default features carry key-pair auth; the
# interactive external-browser SSO flow is deliberately NOT enabled — an
# embedded engine cannot open a browser.
# Consumed from a FORK, pinned by revision, with NO `version` key — and that
# omission is load-bearing, not stylistic. A dependency carrying BOTH a git
# source and a version publishes SUCCESSFULLY with the git source silently
# stripped: the shipped crate would resolve upstream (which has no PUT),
# compile, and fail only at run time. Without the version, packaging refuses
# instead. tools/allowed-git-deps.toml records the arrangement, the crates it
# renders unpublishable, and the exit that retires it.
snowflake-connector-rs = { git = "https://github.com/rapidbyte-io/snowflake-connector-rs.git", rev = "cd9ec04aa7ea65883f5b7bb2a5d6fb6dd0931be5", default-features = false, features = ["key-pair-auth", "put"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
schemars = "1"
jsonschema = "0.48"

# Dev / test
proptest = "1"
criterion = "0.5"
# iai-callgrind: the instruction-count bench library. Pinned EXACTLY to the
# iai-callgrind-runner version installed by CI (.github/workflows/ci.yml,
# perf-gate job) — lib and runner must agree or counts skew; the perf-gate job
# has a step that fails loudly if these drift.
iai-callgrind = "=0.16.1"
wiremock = "0.6"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tempfile = "3"
rcgen = "0.13"
toml = "0.8"
# rdlt-bench (dev-only, publish=false) exclusively — never a runtime dep.
clap = { version = "4", features = ["derive"] }

# Adopted 2026-07-25 from a recorded four-arm sweep (stock / cgu1 / thin / fat+cgu1,
# 9 interleaved runs each on the 1M-row relational cell): fat+cgu1 is the only arm
# that clears a 10% processor-time reduction, at -13.2% CPU, -1.7% wall and a 16%
# smaller binary (93.9 -> 79.0 MB). It costs 119 s on a clean release build (112 ->
# 231 s); thin LTO was measured at -6.1% CPU for no build cost but no size benefit,
# and codegen-units=1 alone carries 11 of the 16 size points for ~free.
#
# NOTE: `[profile.bench]` deliberately does NOT pin the old codegen settings. It
# inherits this profile, so instruction-count baselines shift once and are
# re-recorded deliberately (benches/compare-iai.sh --record) rather than being
# insulated — a divergent bench profile would stop the perf-gate job sharing build
# artifacts with `make release`.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The distribution profile for the shipped CLI. `panic` is deliberately NOT set
# anywhere: an abort strategy would be inherited by every application embedding
# the library, and cargo silently forces unwind for test/bench units regardless,
# so setting it buys a smaller binary at the cost of changing semantics for
# embedders who never asked. Symbol stripping gets most of the size anyway.
[profile.dist]
inherits = "release"
strip = "symbols"

# The mutation-testing profile. Mutation runs rebuild the workspace ONCE PER
# MUTANT — hundreds of times — so build time is the run's dominant cost, and
# nothing about a mutation run needs a debuggable binary: the only question
# asked of it is whether the test suite passes.
#
# `debug = 0` is the large lever. Full debug info dominated both codegen and
# link time AND disk: scratch build directories measured 50-60 GiB EACH under
# the dev profile.
#
# `incremental = false` because each mutant patches a DIFFERENT crate, so
# incremental state rarely hits while always costing disk and bookkeeping.
#
# `codegen-units = 16` is rustc's own non-incremental default, and it is a
# MEASURED choice, not a guess. Setting it to 256 (the incremental default) made
# builds 3x faster and the TEST phase 2.6x slower — 16s build / 66s test against
# the dev profile's 48s / 25s — for a net throughput HALVING, because every
# mutant runs the whole suite and the test phase dominates. Runtime speed is not
# irrelevant here: it is the larger half of the cost.
#
# Deliberately KEPT: `debug-assertions` and `overflow-checks` stay on, because
# they are part of how mutants get CAUGHT — an arithmetic mutant that trips an
# overflow check is a kill, and disabling them would quietly weaken the gate to
# buy speed. `panic` stays `unwind`: the test harness requires it.
[profile.mutants]
inherits = "dev"
debug = 0
strip = "debuginfo"
incremental = false
codegen-units = 16
debug-assertions = true
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

