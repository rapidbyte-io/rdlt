test_tool = "nextest"
profile = "mutants"
# The probes' tests are tests, built only without the `certify` feature, which a mutant's never
# lacks, not code under test; and Kani's proofs, which only Kani compiles, are never a mutant's
# tests.
exclude_globs = [
  "xtask/**",
  "crates/rdlt-sim/**",
  "crates/rdlt-wire/src/generated/**",
  "crates/rdlt-connector/src/serve/probes/tests.rs",
  "crates/*/src/**/proofs.rs",
]
all_features = true
# Whether the kernel marks a range of descriptors at once is true on every kernel of 5.11 or later,
# where the nightly and every machine the project is built on run: a mutant that answers true there
# is the code as it is. Mutation runs build on Linux alone, so a mutant of code built only elsewhere
# is the code as it is in every one of them: how a connector's binary is executed, whether a
# group has a living member, and that bubblewrap launches nothing, on other platforms.
#
# A mutant that returns what the function already returns is the code as it is: an admission's
# limits are the wire's defaults, a dialect reserves no table name, a sandbox names no program
# that confines a connector, and a secret resolver reads from no directory, unless they say
# otherwise; one that names an empty path for a sandbox is the code as it is too, as the guard on
# roots passes over a path that is not absolute.
# So is one that joins open flags, or the options of a wait for a child, each a bit of its own
# (read-only is none, on Linux and macOS alike), with `^` for `|`; and one that takes every widen a
# destination refuses for a column not yet kept from widening: the resolver widens no column kept
# from it on any path, so a refusal never names one, and the guard only bounds the loop were that to
# change. A JSON lines reader's `Debug` names the type and nothing else, since its decoder has none,
# and so does that of the function a host is told each spawned connector's process id through and
# the one that plays a simulated one's; a file writer's names its path only for a failing test's
# message, and a resolver of the environment's secrets its scope only for a person to read: what
# they write is no behaviour a test can hold.
# The engine's inline test env has one core, which a mutant answering one also has. A mutant that
# judges a plain column of 64-bit integers through the rows it names reads what the plain arm reads,
# which spares only the mapping; and one that has a normalized flush's walk read every column for
# such integers, not only one whose type holds them, finds none in the others. A history table reads
# a key's newest version for its sequence alone, so a mutant that takes, of two versions it loads
# with one sequence, the later as the newer reads the same sequence. A mutant that lets `starts` try
# a secret's empty start tries it only after every longer start has failed, and it counts no bytes,
# as finding none does. One that splices a short length in, as a long one is, writes the byte the
# short one's arm writes; and one that marks a buffer of no bytes as seen marks an address no
# allocation starts at, as the buffer holds none. Arrow refuses a dictionary a valid key of which
# names no value, so a mutant that takes a key as great as the values' count as naming one meets
# none.
# The JSON lines reader joins two runs' columns taking a column both hold in its first arm, so a
# mutant that takes it by `<=` for `<` in the next never meets it. Its pass over a line's keys takes
# a string for a key only at the record's depth and before a colon; a mutant that takes one by `||`
# for `&&` takes more only from a string value, whose key the next key replaces before any value
# reads it, and from a line that is no JSON, which the line's decoder refuses all the same.
# SQLite cuts no table's derived names, as its identifiers have no limit, and each begins with a
# prefix no table may take, so no two tables derive one name: a mutant that finds no clash between
# them finds what the check finds, and so does one that checks again, and creates the generation
# table where it exists, each time a writer readies a table.
#
# One mutant is excluded because it never ends rather than because it is the code as it is: one
# that writes a length in LEB128 while the length is under 0x80 pushes bytes until memory runs out,
# which kills a whole run, not just its test. A bound on the loop would cost every value's length
# about 4 % more instructions to normalize. The length's test pins every other mutant of the loop.
#
# So are the mutants of the JSON scanner's step that stop it moving forward: one that steps back
# or stays where it is, by `-` or `*` for `+` in where the next mark is found or where looking
# resumes, and one that sends a string's end to the text's start. The scanner then gives the
# same marks forever and what reads them grows until memory runs out. A bound on the loop would
# cost every byte the shredder scans; the scanner's tests pin every other mutant of the step.
#
# So is the mutant that has a call's reader of messages give a default message on every read
# instead of the next one, or the end: each caller reads messages until the call ends, so it
# reads forever, holding what each message asks, until memory runs out. Its callers' tests fail
# first, but the run is killed. A check on progress cannot sit in the reader the mutant replaces
# whole, only in each of its callers' loops.
#
# A rendering's text takes a string by its worst case when that fits and by its escaped length
# when not, and the escaped length never exceeds the worst case, so a mutant that sends a string
# of exactly the worst case's room the long way finds it has the room.
#
# A bench's Zipf draw takes the first key whose summed weight passes a uniform number, which lands
# on a sum exactly with a chance of about one in 2^53, so a mutant that takes the first sum at least
# the number draws the same keys.
#
# A mutant that joins a hex digit to the value before it with `^` for `|` is the code as it is: the
# value is shifted left four bits first, so its low four bits are clear and both give one result. So
# is one that joins a byte to the bits of base 32 held before it, shifted left eight bits first, or
# a count to a process's id in a staging's token, shifted above it.
exclude_re = [
  "crates/rdlt-connector/src/json/structure\\.rs:4[67]:[0-9]+: replace \\+ with [-*] in <impl Iterator for Structure<'_>>::next$",
  "crates/rdlt-connector/src/json/structure\\.rs:.*replace string_end -> usize with [01]$",
  "crates/rdlt-wire/src/plane/incoming\\.rs:.*replace Incoming<M>::message -> Result<Option<M>, Status> with Ok\\(Some\\(Default::default\\(\\)\\)\\)$",
  "crates/rdlt-engine/src/json/text\\.rs:.*replace \\| with \\^ in hex$",
  "crates/rdlt-adopt/src/exec\\.rs:.*replace marks_at_once -> bool with true",
  "crates/rdlt-connector-reference/src/files/format/held/keys\\.rs:54:[0-9]+: replace && with \\|\\| in Pass<'l>::step$",
  "crates/rdlt-connector-reference/src/files/format/held\\.rs:.*replace < with <= in union$",
  "crates/rdlt-connector-reference/src/files/format/json\\.rs:.*replace <impl std::fmt::Debug for Rows>::fmt -> std::fmt::Result with Ok\\(Default::default\\(\\)\\)",
  "crates/rdlt-connector-reference/src/files/format\\.rs:.*replace <impl std::fmt::Debug for Writer<'_>>::fmt -> std::fmt::Result with Ok\\(Default::default\\(\\)\\)",
  "crates/rdlt-connector/src/merge/history\\.rs:.*replace > with >= in History::hold$",
  "crates/rdlt-connector-reference/src/rooted\\.rs:.*replace \\| with \\^ in Dir::(resolved|dir|opened|create)$",
  "crates/rdlt-connector-reference/src/sqlite/database\\.rs:.*replace \\| with \\^ in (opened|reading)$",
  "crates/rdlt-connector-reference/src/sqlite/session/owners\\.rs:.*replace distinct -> Result<\\(\\)> with Ok\\(\\(\\)\\)$",
  "crates/rdlt-connector-reference/src/sqlite/session/writer\\.rs:.*replace && with \\|\\| in ready$",
  "crates/rdlt-connector/src/cost/expanded/named\\.rs:.*replace < with <= in Meter::keyed$",
  "crates/rdlt-connector/src/cost/held\\.rs:.*replace > with >= in Allocations::buffer$",
  "crates/rdlt-connector/src/sink\\.rs:.*replace Admission::limits -> Limits with Default::default\\(\\)",
  "crates/rdlt-connector/src/sqlgen/tables\\.rs:.*replace \\| with \\^ in base32$",
  "crates/rdlt-connector/src/sqlgen\\.rs:.*replace SqlDialect::reserves_table -> bool with false",
  "crates/rdlt-engine/src/bench/zipf\\.rs:.*replace <= with < in Zipf::draw$",
  "crates/rdlt-engine/src/env/inline\\.rs:.*replace <impl Env for InlineEnv>::cores -> NonZeroUsize with 1\\.try_into\\(\\)\\.unwrap\\(\\)",
  "crates/rdlt-engine/src/normalize/identity\\.rs:.*replace >= with < in leb128$",
  "crates/rdlt-engine/src/shred/render\\.rs:.*replace > with >= in Rendering::string$",
  "crates/rdlt-engine/src/normalize/identity\\.rs:.*replace match guard short < 0x80 with false in length_of$",
  "crates/rdlt-engine/src/normalize/rounding\\.rs:.*replace integers -> bool with true$",
  "crates/rdlt-engine/src/table/exact\\.rs:.*delete match arm DataType::Int64 in rounds$",
  "crates/rdlt-engine/src/table/registry\\.rs:.*replace match guard !resolver\\.unwidened\\.contains\\(&column\\) with true in Tables::fit$",
  "crates/rdlt-engine/src/wal/local/dir\\.rs:.*replace \\| with \\^ in Dir::(dir|create|open)$",
  "crates/rdlt-engine/src/wal/local/names\\.rs:.*replace \\| with \\^ in (base32|token)$",
  "crates/rdlt-host/src/local/bubblewrap\\.rs:254:5: replace launched -> Result<Launcher, SandboxError> with ",
  "crates/rdlt-host/src/local/grants/opened\\.rs:.*replace \\| with \\^ in (up|holding)$",
  "crates/rdlt-host/src/local/process/command\\.rs:272:5: replace trusted -> std::io::Result<\\(Command, Vec<OwnedFd>\\)> with ",
  "crates/rdlt-host/src/local/process/group/members\\.rs:22:5: replace unended -> Option<bool> with Some\\((true|false)\\)$",
  "crates/rdlt-host/src/local/process/group\\.rs:.*replace \\| with \\^ in asked$",
  "crates/rdlt-host/src/local/process\\.rs:.*replace <impl fmt::Debug for Told>::fmt -> fmt::Result with Ok\\(Default::default\\(\\)\\)",
  "crates/rdlt-host/src/local/process/played\\.rs:.*replace <impl fmt::Debug for Play>::fmt -> fmt::Result with Ok\\(Default::default\\(\\)\\)",
  "crates/rdlt-host/src/local/sandbox\\.rs:.*replace Sandbox::programs -> Vec<PathBuf> with vec!\\[(Default::default\\(\\))?\\]",
  "crates/rdlt-host/src/secrets/redact\\.rs:.*replace > with >= in starts$",
  "crates/rdlt-host/src/secrets/resolve/env\\.rs:.*replace <impl fmt::Debug for EnvSecrets>::fmt -> fmt::Result with Ok\\(Default::default\\(\\)\\)",
  "crates/rdlt-host/src/secrets/resolve/file\\.rs:.*replace \\| with \\^ in read_private$",
  "crates/rdlt-host/src/secrets/resolve\\.rs:.*replace SecretResolver::directories -> Vec<PathBuf> with vec!\\[\\]$",
]
# A mutant that hangs a test is caught when nextest terminates the test, which it does well within
# this; cargo-mutants' own timeout would count it as a timeout instead. It is above what a mutant
# no test catches takes, every tested package's whole suite beside another mutant's: a shard's
# baseline tests only the packages it mutates, and the timeout derived from it can fall short.
minimum_test_timeout = 900
